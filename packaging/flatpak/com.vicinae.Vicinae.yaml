# Flatpak manifest for the Rust engine.
#
# Bluefin has no traditional package manager, so this is the *development* target from Phase 0
# rather than a packaging step at the end -- see docs/rust-engine/PLAN.md section 3.6. If the dev
# loop is `cargo run` on a mutable host for six months, we will build something that does not work
# where it ships.
#
# Every finish-arg below is justified in README.md in this directory. Do not add one without adding
# its justification: this manifest goes through Flathub review, and "we needed it" is not a reason
# a reviewer can check.
#
#   flatpak-builder --user --install --force-clean build packaging/flatpak/com.vicinae.Vicinae.yaml
#   flatpak run com.vicinae.Vicinae -- doctor --check-only

app-id: com.vicinae.Vicinae

# org.freedesktop.Platform, not org.kde.Platform as the original spec had: the Rust engine draws
# with Iced/wgpu and needs neither Qt nor GTK at runtime. The smaller runtime is also a smaller
# attack surface and a faster download.
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  # Node for the extension runtime. Its binary is copied into /app below: an SDK
  # extension exists at build time only.
  - org.freedesktop.Sdk.Extension.node22

command: vicinae

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/vicinae/cargo

finish-args:
  # --- Network -------------------------------------------------------------
  # Extensions fetch their data (translate, GIPHY, Flathub, stocks...), views load remote images,
  # OAuth exchanges its code, and the stores download bundles. Without this every lookup inside the
  # sandbox fails with EAI_AGAIN; Suite 1 inside the Flatpak found it.
  - --share=network
  # --- Display -------------------------------------------------------------
  # Wayland is the target. No fallback-x11: the engine is Wayland-only by design, and claiming an
  # X11 socket we never use would be asking for a permission we do not need.
  - --socket=wayland
  # It is also the only grant the wlroots track needs (PLAN.md Phase 5, Track B): layer-shell,
  # foreign-toplevel, data-control and xx-hotkey are all globals on this one socket. No permission
  # here can widen them: where Flatpak connects through wp_security_context_v1 (Flatpak 1.16+),
  # the compositor may hide privileged globals such as data-control or foreign-toplevel from a
  # sandboxed client, and the launcher then degrades exactly as when they are absent.
  # Iced renders through wgpu, which needs the GPU. Without this it falls back to software
  # rendering, if it starts at all.
  - --device=dri

  # --- Our own bus name ----------------------------------------------------
  - --own-name=com.vicinae.Vicinae

  # --- Portals -------------------------------------------------------------
  # GlobalShortcuts is the hotkey mechanism on GNOME and the one part of the original spec that
  # works there unchanged. The rest are ordinary desktop integration.
  # Note: portal access is mediated by xdg-desktop-portal itself; these talk-names are for the
  # cases where we address a backend directly.
  - --talk-name=org.freedesktop.portal.Desktop

  # --- GNOME Shell extension ----------------------------------------------
  # On GNOME 50/51 this is the *only* mechanism for window switching, clipboard history and paste:
  # Mutter implements none of ext-foreign-toplevel-list-v1, wlr-foreign-toplevel-management or
  # wlr-data-control, and org.gnome.Shell.Introspect is allowlisted to the portal backends.
  # See docs/rust-engine/REFERENCES.md section 3.
  #
  # This is a talk-name, not a filesystem grant. We never install the extension ourselves --
  # see ADR-0004 -- we only speak to it if the user has installed it.
  #
  # The name is org.gnome.Shell because a talk-name filters BUS NAMES, and an extension's
  # objects live on the Shell's own connection. This used to read
  # org.gnome.Shell.Extensions.Vicinae, an interface name no process owns, so the sandbox's
  # D-Bus proxy blocked every window and clipboard call. compass-shell's extension_contract
  # test now ties this line to contract::SHELL_SERVICE. The grant is what every
  # extension-talking Flatpak needs; Shell guards its sensitive methods (Eval, Screenshot) by
  # sender allowlist, not by bus policy.
  - --talk-name=org.gnome.Shell

  # --- The tray -----------------------------------------------------------
  # Compass's own tray icon registers with the desktop's watcher, and Search Tray asks it for
  # the other applications' icons (vicinae::tray_icon, vicinae::tray_host). The icon registers
  # under its unique name, so no own-name is needed for it.
  - --talk-name=org.kde.StatusNotifierWatcher

  # --- Power Management ---------------------------------------------------
  # Power off, reboot, suspend, hibernate, lock and log out (compass-power). logind is on the
  # system bus; logout asks the desktop's own session manager on the session bus, as the C++
  # does. Every action is still subject to logind's polkit policy.
  - --system-talk-name=org.freedesktop.login1
  - --talk-name=org.gnome.SessionManager
  - --talk-name=org.kde.Shutdown

  # --- Launching host applications ----------------------------------------
  # A launcher that cannot launch is not a launcher. flatpak-spawn --host is how a sandboxed app
  # starts a host program, and it is genuinely a large grant: it is equivalent to running outside
  # the sandbox. It is also unavoidable for this category of application, and we should say so
  # plainly in review rather than bury it.
  - --talk-name=org.freedesktop.Flatpak

  # --- Reading the application catalogue -----------------------------------
  # Read-only. We index .desktop files and icons to know what exists; we never write here.
  - --filesystem=host-os:ro
  - --filesystem=xdg-data/applications:ro
  - --filesystem=xdg-data/icons:ro
  - --filesystem=xdg-data/flatpak/exports/share/applications:ro
  - --filesystem=xdg-data/flatpak/exports/share/icons:ro
  - --filesystem=/var/lib/flatpak/exports/share/applications:ro
  - --filesystem=/var/lib/flatpak/exports/share/icons:ro
  # THE EXPORTS DIRECTORIES ABOVE CONTAIN SYMLINKS, NOT FILES, and the grants
  # below are what makes them resolve. flatpak-dir.c's export_dir builds every
  # link with the prefix `../app/<id>/current/active/export`, so
  #
  #   exports/share/applications/com.google.Chrome.desktop
  #     -> ../../../app/com.google.Chrome/current/active/export/share/applications/...
  #
  # and the entry a launcher actually reads lives in the deploy tree. Granting
  # only the exports directory gives us a directory full of links pointing at
  # nothing: every Flatpak application on the machine disappears from search,
  # silently, with no error anywhere -- which is #105.
  #
  # `current` and `active` are themselves symlinks into a commit directory, so
  # the whole `app` tree is the grant; there is no narrower one that resolves.
  # Read-only, and the repo/ and runtime/ trees stay ungranted.
  - --filesystem=xdg-data/flatpak/app:ro
  - --filesystem=/var/lib/flatpak/app:ro
  # Bluefin puts CLI tooling in Homebrew, and users expect those to be findable.
  - --filesystem=/home/linuxbrew/.linuxbrew/share/applications:ro

  # --- Search Files -------------------------------------------------------
  # The file indexer (vicinae-file-indexer, spawned by the engine) scans and watches the
  # directories in the file extension's "Search paths" preference, the home directory by
  # default. Read-only: it never writes there; its index lives in the sandbox's own cache.
  - --filesystem=home:ro

modules:
  - name: vicinae
    buildsystem: simple
    build-options:
      env:
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked -p vicinae -p compass-sandbox --bins
      # The same install the AppImage, Arch and Nix packages run, so every output ships the
      # same files in the same places (Suite 5, scripts/packaging/smoke.sh, checks them):
      #   bin/vicinae
      #   libexec/vicinae/compass-sandbox-exec  confines the extension runtime (Landlock +
      #                                         seccomp); the engine refuses to run
      #                                         extensions without it
      #   libexec/vicinae/vicinae-file-indexer  the file-search helper
      #   share/applications, share/metainfo, share/icons: the desktop entry and its icon
      #   share/vicinae/builtin-icons           the `Icon.*` set extensions draw with, found
      #                                         through $XDG_DATA_DIRS
      #   share/vicinae/vicinae.schema.json     the published config schema
      #   share/vicinae/extension-runtime.js    the extension runtime bundle, when present
      #   share/compass/scripts/*               the first-party Rhai scripts, found through
      #                                         $XDG_DATA_DIRS and granted what they declare
      # The bundle is built outside flatpak-builder (scripts/build-extension-runtime.sh needs
      # figura and npm, neither of which the offline build has) and picked up from the source
      # tree. A build without it still works and the engine says the runtime is missing; the
      # Flatpak workflow builds it first and asserts it arrived.
      - PREFIX=/app LIBEXECDIR=/app/libexec ./scripts/packaging/install-rust-engine.sh
      # The raycast://, com.raycast: and vicinae:// handler: an OAuth provider redirects the
      # browser to raycast://oauth?code=…, and this is what carries it back to the extension that
      # asked (`vicinae deeplink`). Exported like any app desktop file; no permission needed.
      - install -Dm644 packaging/flatpak/com.vicinae.Vicinae.UrlHandler.desktop
        /app/share/applications/com.vicinae.Vicinae.UrlHandler.desktop
      # Node for the extension runtime: an SDK extension exists at build time only.
      - install -Dm755 /usr/lib/sdk/node22/bin/node /app/bin/node
    sources:
      - type: dir
        path: ../..
        # What building the extension runtime leaves behind, none of it needed
        # here: the bundle in dist/ is self-contained.
        skip:
          - .build
          - src/typescript/api/node_modules
          - src/typescript/extension-manager/node_modules
      # Generated by `flatpak-cargo-generator.py Cargo.lock -o cargo-sources.json`, which is why
      # Cargo.lock must stay committed. Flathub builds have no network access, so every dependency
      # has to be declared up front.
      - cargo-sources.json
