[package]
name = "compass-a11y-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
accesskit.workspace = true
accesskit_unix.workspace = true
compass-platform.workspace = true
tracing.workspace = true

[dev-dependencies]
# Reading the tree back off a private accessibility bus, as Orca would: the
# AT-SPI client proxies `accesskit_unix` itself is built on (no new crate).
atspi = { version = "0.29", default-features = false, features = ["proxies"] }
zbus.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
compass-core.workspace = true
compass-ui.workspace = true
tempfile.workspace = true
