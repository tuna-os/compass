[package]
name = "compass-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
walkdir.workspace = true
compass-xdg.workspace = true
compass-search.workspace = true
compass-core.workspace = true
compass-crypto.workspace = true
compass-ipc.workspace = true
tokio.workspace = true

# PLAN §8.7's pre-flight command names this target. It produces the criterion
# baselines the SLA rows are compared across commits; the thresholds themselves
# are asserted in tests, because a bench exits zero whatever it prints.
[[bench]]
name = "slas"
harness = false

[[bin]]
name = "parity"
path = "src/parity.rs"

[[bin]]
name = "head-to-head"
path = "src/head_to_head.rs"

# Suite 0 rung 1 (PLAN §8.1a): diffs upstream Vicinae's C++ scorer against the
# Rust one. Needs the probe built and passed with --probe; see
# scripts/bench/probes/fuzzy-probe.cpp.
[[bin]]
name = "scorer-parity"
path = "src/scorer_parity.rs"

# Times the fuzzy ranker for docs/rust-engine/BENCHMARKS.md, beside
# scripts/bench/fuzzy/cpp_rank.cpp for the C++ scorer.
[[bin]]
name = "fuzzy-throughput"
path = "src/fuzzy_throughput.rs"

# Suite 0 (PLAN §8.4a): cross-decrypts upstream Vicinae's C++ clipboard crypto
# against the Rust one. Needs the probe built and passed with --probe; see
# scripts/bench/probes/crypto-probe.cpp.
[[bin]]
name = "crypto-parity"
path = "src/crypto_parity.rs"

[dev-dependencies]
criterion = { version = "0.5", features = ["async"] }
tempfile.workspace = true
