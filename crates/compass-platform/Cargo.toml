[package]
name = "compass-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
# The decisions a platform carries out (`login_start::Status`); compass-core is shared, so the
# seam holds.
compass-core.workspace = true
compass-xdg.workspace = true
# A window's native handles, for `WindowMaterial` (the 0.6 iced and winit lend;
# every platform has them, so the seam holds).
raw-window-handle = "0.6"
# The accessibility tree the launcher describes itself as (ADR-0022 §1);
# platform-neutral, every platform's adapter takes it.
accesskit.workspace = true

[dev-dependencies]
tempfile.workspace = true