[package]
name = "compass-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
# `image-without-codecs` rather than `image`, plus PNG on our own `image`
# dependency. The full `image` feature turns on every codec the crate has --
# AVIF encoding, OpenEXR, TIFF, GIF -- none of which an icon theme ships, and
# all of which would be built into a launcher that draws icons only when asked
# to. Icon themes are PNG and SVG; `crate::icons::classify` accepts exactly
# those two and nothing else, so a format we cannot decode falls back to the
# row's initial rather than drawing an empty box.
iced = { version = "0.14", features = ["wayland", "image-without-codecs", "svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }
iced_winit = { version = "0.14", features = ["wayland"] }
winit = { version = "0.30", features = ["wayland"] }
compass-core.workspace = true
compass-search.workspace = true
compass-xdg.workspace = true
compass-platform.workspace = true
serde = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
# Renders `view()` headlessly, which nothing else in the workspace can do.
# See `tests/view.rs` for why that gap mattered.
iced_test = "0.14"
# Only so a test can read what `update` logged: the state line is asserted in
# the VM tier, and a log line nobody can control locally is a log line nobody
# checks.
tracing-subscriber.workspace = true