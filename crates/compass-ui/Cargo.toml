[package]
name = "compass-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
# `image-without-codecs` rather than `image`, plus PNG on our own `image`
# dependency. The full `image` feature turns on every codec the crate has --
# AVIF encoding, OpenEXR, TIFF, GIF -- none of which an icon theme ships, and
# all of which would be built into a launcher that draws icons only when asked
# to. Icon themes are PNG and SVG; `crate::icons::classify` accepts exactly
# those two and nothing else, so a format we cannot decode falls back to the
# row's initial rather than drawing an empty box.
iced = { version = "0.14", features = ["wayland", "image-without-codecs", "svg", "tokio", "markdown"] }
# JPEG too, for remote images: avatars are mostly JPEG. zune-jpeg, pure Rust.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
iced_winit = { version = "0.14", features = ["wayland"] }
winit = { version = "0.30", features = ["wayland"] }
compass-core.workspace = true
compass-search.workspace = true
compass-extension-api = { path = "../compass-extension-api" }
serde_json.workspace = true
compass-xdg.workspace = true
compass-platform.workspace = true
serde = { workspace = true }
ureq.workspace = true
sha2.workspace = true
tempfile.workspace = true
# The local time for a file preview's modified date (already in the tree through `vicinae`).
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }

# The layer-shell presentation for wlroots compositors (PLAN.md Phase 5 Track
# B). Linux-only by target so the platform seam holds: macOS and Windows never
# build it. Default features off: the one default, `linux-theme-detection`,
# pulls `mundy` to read the colour scheme, which `crate::appearance` already
# does through the Settings portal.
[target.'cfg(target_os = "linux")'.dependencies]
iced_layershell = { version = "0.19", default-features = false }

[dev-dependencies]
tempfile.workspace = true
insta.workspace = true
# Renders `view()` headlessly, which nothing else in the workspace can do.
# See `tests/view.rs` for why that gap mattered.
iced_test = "0.14"
# Only so a test can read what `update` logged: the state line is asserted in
# the VM tier, and a log line nobody can control locally is a log line nobody
# checks.
tracing-subscriber.workspace = true
