[package]
name = "vicinae"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "vicinae"
path = "src/lib.rs"

[[bin]]
name = "vicinae"
path = "src/main.rs"

[[bin]]
name = "vicinae-file-indexer"
path = "src/bin/vicinae-file-indexer.rs"

[lints]
workspace = true

[dependencies]
compass-core.workspace = true
compass-db = { path = "../compass-db" }
compass-ipc.workspace = true
notify.workspace = true
compass-portals.workspace = true
compass-media = { path = "../compass-media" }
compass-power = { path = "../compass-power" }
futures-util.workspace = true
compass-ui.workspace = true
compass-platform.workspace = true
compass-platform-linux.workspace = true
compass-xdg.workspace = true
mime_guess.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true
zbus.workspace = true
oo7.workspace = true
compass-clipboard.workspace = true
compass-worker-host.workspace = true
compass-extension-api = { path = "../compass-extension-api" }
compass-local-storage = { path = "../compass-local-storage" }
wait-timeout = "0.2"
notify-rust = { version = "4.18", default-features = false, features = ["z-with-tokio"] }
compass-sandbox = { path = "../compass-sandbox" }
compass-shell.workspace = true
compass-wayland.workspace = true
compass-crypto.workspace = true
compass-sqlcipher-sys.workspace = true
getrandom.workspace = true
thiserror.workspace = true
landlock.workspace = true
seccompiler.workspace = true
libc.workspace = true
tempfile.workspace = true

[dev-dependencies]
iced = { version = "0.14", features = ["tokio"] }
iced_winit = "0.14"
compass-testkit.workspace = true
tempfile = "3"
# The headless-Sway harness shared with compass-wayland (tests/wlroots_engine.rs).
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
