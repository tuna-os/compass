[package]
name = "compass-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
slug.workspace = true
percent-encoding.workspace = true
url.workspace = true
fend-core.workspace = true
# Reading the ECB's exchange rates (`exchange_rates`); already in the workspace for compass-xdg.
roxmltree.workspace = true
compass-xdg.workspace = true
compass-search.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
jsonc-parser.workspace = true
serde_path_to_error.workspace = true
# "Did you mean" for a mistyped `compass.json` key; already in the tree for compass-search.
strsim = "0.11"
getrandom.workspace = true
thiserror.workspace = true
dirs.workspace = true
tracing.workspace = true
unicode-normalization.workspace = true
base64.workspace = true
zip.workspace = true
ignore.workspace = true
# User theme files (`theme_file`); the same line compass-script reads manifests with.
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
xkeysym = "0.2"

# The calculator's time limit counts the evaluating thread's CPU time (`calculator`); already in
# the tree for the Wayland crates.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "time"] }

[dev-dependencies]
compass-testkit.workspace = true
tempfile = "3"
proptest.workspace = true
