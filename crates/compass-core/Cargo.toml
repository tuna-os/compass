[package]
name = "compass-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
slug.workspace = true
percent-encoding.workspace = true
url.workspace = true
fend-core.workspace = true
# Reading the ECB's exchange rates (`exchange_rates`); already in the workspace for compass-xdg.
roxmltree.workspace = true
compass-xdg.workspace = true
compass-search.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
jsonc-parser.workspace = true
getrandom.workspace = true
thiserror.workspace = true
dirs.workspace = true
tracing.workspace = true
unicode-normalization.workspace = true
base64.workspace = true
zip.workspace = true
ignore.workspace = true
# User theme files (`theme_file`); the same line compass-script reads manifests with.
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
xkeysym = "0.2"

[dev-dependencies]
compass-testkit.workspace = true
tempfile = "3"
proptest.workspace = true
