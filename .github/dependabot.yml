# Keeps the actions current. Every `uses:` names an exact version tag, and
# .github/workflows/actions.lock pins the commit it resolved to; Dependabot
# updates both together.
#
# Cargo is deliberately not here: every Cargo.lock change has to regenerate
# packaging/flatpak/cargo-sources.json (flatpak.yaml checks it), which
# Dependabot cannot do. tuna-os/.github stays on @main by design, and
# Dependabot leaves branch refs alone.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
