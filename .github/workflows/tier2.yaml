# Tier 2: headless GNOME in a container.
#
# PLAN.md §8.8 names four tiers. THIS ONE WAS NEVER BUILT — until this file,
# grepping the repository for `gnome-shell --headless` returned exactly one
# hit, the paragraph describing it. So what shipped was Tier 1 (seconds, no
# display) and Tier 3 (QEMU, twenty-plus minutes) with nothing in between.
#
# That gap widened deliberately when the VM tier moved off launcher PRs, so a
# launcher integration regression is currently caught by the nightly run rather
# than by the PR that introduced it. Tier 2 is what §8.8 designed to fill it, at
# a fraction of the cost.
#
# It also carries SUITE 3b: the launcher exercised on GNOME 50 and 51, which
# §8.8 asks for and #4's exit gate requires.
#
# IT WAS BUILT AS A SEQUENCE OF SPIKES, AND EACH ONE FOUND SOMETHING.
#
# The premise was never verified, so it was asked one question at a time rather
# than written whole and hoped over. Four answers, all of which would have been
# baffling failures inside a finished tier:
#
#   1. `dbus-launch` is in `dbus-x11`, not `dbus-daemon` or `dbus-tools`.
#   2. GNOME SHELL DOES NOT RUN HERE. It needs systemd-logind and dies in its
#      JS UI layer building the background. Mutter is fine — surfaceless
#      renderer, virtual monitor, wayland-0 — so this tier runs the compositor
#      and NOT the Shell. Anything Shell-resident, our GNOME Shell extension
#      above all, still needs the VM tier.
#   3. Flatpak needs `--privileged`. `SYS_ADMIN` plus unconfined seccomp is not
#      enough for `mount --make-rslave`, which bubblewrap requires.
#   4. Killing `flatpak run` does not kill the engine inside the sandbox, so a
#      stale engine answered the next run from an index built before it. The
#      smoke's own control caught that, before merge.
#
# That last one is why `prove-smoke.sh` exists and is not optional. A tier that
# has only ever been green is indistinguishable from one that tests nothing —
# a defect this repository has found four times (`launcher-rss` on `0 kB`, the
# unwired `parity` binary, the absent `--bench slas` target, the `spike.rs`
# path filter naming a directory). So the smoke is run twice on every
# invocation: with its fixture, which must pass, and without, which must fail.
#
# WHAT IT COVERS, AND WHAT IT CANNOT
#
# Covers: a real Mutter compositor advertising the globals that matter
# (`xdg_activation_v1` among them), the shipped Flatpak installed from its own
# bundle, and a desktop entry found through exactly the permissions
# `com.vicinae.Vicinae.yaml` grants — which is the sandbox seam Tier 1 cannot
# reach by construction.
#
# Cannot: the Shell, per (2). The VM tier stays the only tier that boots what
# users actually install.
name: Tier 2 (headless compositor)

on:
  workflow_dispatch:
  # PRs — the tier's own plumbing AND the code it exercises.
  #
  # The VM tier gave these paths up: twenty-plus minutes on three VMs,
  # cancelled by the next push more often than not. This tier does comparable
  # integration work in **92 seconds**, measured rather than estimated:
  #
  #     compositor, Fedora 44 / 45          54s / 45s
  #     Flatpak install + smoke + control   92s
  #
  # §8.8 budgets it under ten minutes. It uses a sixth of that, so the per-PR
  # coverage the VM tier could not afford is affordable here.
  pull_request:
    paths:
      # The tier itself.
      - .github/workflows/tier2.yaml
      - scripts/tier2/**
      # What it packages and runs.
      - .github/workflows/flatpak.yaml
      - packaging/flatpak/**
      # The code it exercises: the engine that answers, the indexing that
      # decides what it answers with, and the sandbox seam between them.
      # Narrower than `crates/**` — a change to the clipboard crypto does not
      # need a compositor to answer for it.
      - crates/vicinae/**
      - crates/compass-core/**
      - crates/compass-xdg/**
      - crates/compass-ipc/**
      - crates/compass-ui/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spike:
    name: "Tier 2 spike: does a compositor come up headless in a container?"
    runs-on: ubuntu-24.04
    # §8.8 budgets the real Tier 2 job at under 10 minutes. The spike installs
    # a desktop's worth of packages, so it is allowed more than the tier will
    # be — but not unbounded, because "how long does this take" is part of what
    # the spike is measuring.
    timeout-minutes: 30

    strategy:
      # Both, because Suite 3b needs GNOME 50 AND 51 and the whole point of
      # spiking is to find out now if one of them does not work. fail-fast off
      # so a failure on one still reports the other: "44 works, 45 does not" is
      # a far more useful finding than "something failed".
      fail-fast: false
      matrix:
        fedora: ["44", "45"]

    container:
      image: fedora:${{ matrix.fedora }}
      # The shell needs a writable runtime dir and its own tmpfs; without
      # --privileged this is the smaller hammer that usually suffices.
      options: --shm-size=2g

    steps:
      - uses: actions/checkout@v4

      # Listed explicitly rather than pulling a desktop group: a group would
      # drag in a display manager and a browser, and the question is what the
      # MINIMUM is for the real tier to stay inside its ten-minute budget.
      #
      # dbus-x11 is here for `dbus-launch`, which is NOT in dbus-daemon or
      # dbus-tools despite the names — the spike's first run found that out by
      # failing on it, which is what a spike is for.
      #
      # wayland-utils provides `wayland-info`, the real client this spike
      # connects with. A socket file proves a bind(); a client reading the
      # global registry proves a compositor.
      #
      # gnome-shell stays installed although it is no longer started: the
      # second run established it cannot run without systemd-logind, and
      # leaving it here makes that finding visible (`gnome-shell --version`
      # succeeds, the session still does not use it) rather than looking like
      # an oversight.
      - name: Install a headless GNOME
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            gnome-shell \
            mutter \
            wayland-utils \
            xdg-desktop-portal \
            xdg-desktop-portal-gnome \
            dbus-daemon \
            dbus-tools \
            dbus-x11 \
            glib2 \
            procps-ng

      - name: Does a compositor come up, and serve a client?
        run: scripts/tier2/headless-gnome-spike.sh

      # The log is the finding when this fails, and a failed spike is a result
      # rather than an accident — so it is kept either way.
      - name: Keep the compositor's log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compositor-log-f${{ matrix.fedora }}
          path: |
            /tmp/gnome-shell.log
            /tmp/wayland-info.txt
            /tmp/tier2-engine.log
            /tmp/tier2-query.err
          if-no-files-found: warn
          retention-days: 7

  # The next question, and deliberately a separate job from the one above.
  #
  # The compositor spike answers "can a session exist here". This answers "can
  # the thing we ship run inside it" — and it is a genuinely different
  # unknown, because Flatpak needs bubblewrap and bubblewrap needs user
  # namespaces, which a container may or may not grant.
  #
  # Asked smallest-first, as the compositor spike was: this runs the Flatpak's
  # `--version`, not the launcher. If `flatpak run` cannot execute at all, a
  # failure to paint a window would be a confusing way to find that out.
  flatpak:
    name: Flatpak
    uses: ./.github/workflows/flatpak.yaml

  run-flatpak:
    name: "Suite 3b: the launcher on GNOME ${{ matrix.gnome }}"
    needs: [spike, flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # SUITE 3b. §8.8 asks for "a scripted session against both GNOME 50 and
    # 51", and #4's exit gate requires the launcher to run "under GNOME 50 AND
    # 51" — a matrix that existed nowhere, so "runs under 50" was true by
    # accident and "runs under 51" was untested.
    #
    # It started as one image deliberately: a matrix is for a question already
    # known to have two answers worth having, and "can a Flatpak run in a
    # container at all" had no answer yet. It does now — proven on 44 — so the
    # second leg is the cheap part, and the job is named for what it tests
    # rather than for the version of Fedora that happens to carry it.
    #
    # fail-fast off for the same reason the compositor matrix has it: "50 works,
    # 51 does not" is a finding, and losing it to a cancelled sibling would
    # waste the run that found it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - fedora: "44"
            gnome: "50"
          - fedora: "45"
            gnome: "51"

    container:
      image: fedora:${{ matrix.fedora }}
      # --privileged, and the smaller hammer was tried first.
      #
      # `--security-opt seccomp=unconfined --cap-add SYS_ADMIN` was not enough:
      #
      #     bwrap: Failed to make / slave: Permission denied
      #
      # That is `mount --make-rslave` on the container's root, which needs more
      # than SYS_ADMIN grants inside a Docker container — the mount namespace
      # itself is restricted. Flatpak cannot sandbox without it, so this is
      # privilege or nothing.
      #
      # Acceptable here in a way it would not be elsewhere: an ephemeral
      # GitHub-hosted runner, executing this repository's own code, to test the
      # artifact we ship. If it is still not enough, the finding is that
      # Tier 2 stops at the protocol layer and the Flatpak needs the VM tier —
      # which is a real answer and #119 records it either way.
      options: --privileged --shm-size=2g

    steps:
      - uses: actions/checkout@v4

      - name: Install a compositor and Flatpak
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            mutter \
            wayland-utils \
            dbus-daemon \
            dbus-tools \
            dbus-x11 \
            glib2 \
            procps-ng \
            flatpak \
            bubblewrap

      - name: Fetch the Flatpak bundle
        uses: actions/download-artifact@v4
        with:
          name: flatpak-bundle
          path: /tmp/bundle

      - name: What did we get?
        run: ls -la /tmp/bundle

      # Against the compositor, because a Flatpak that runs but cannot reach a
      # Wayland display has not answered the question this tier is about.
      - name: Can it install and run?
        run: |
          scripts/tier2/headless-gnome-spike.sh \
            scripts/tier2/run-flatpak-probe.sh

      # The smoke, and the proof that it can fail, in one step.
      #
      # `prove-smoke.sh` runs the smoke twice against the same sandbox and
      # compositor: with its fixture installed (must pass) and with it deleted
      # (must fail). The second run is the control, and it is not optional —
      # a tier that has only ever been green is indistinguishable from one that
      # tests nothing, which is a defect this repository has found four times
      # (`launcher-rss` on `0 kB`, the unwired `parity` binary, the absent
      # `--bench slas` target, the `spike.rs` path filter matching a directory
      # that is not a file).
      #
      # Both runs share one compositor: bringing it up twice would make the
      # two outcomes differ by more than the fixture, and then the control
      # would prove nothing.
      - name: Does the smoke work, and can it fail?
        run: |
          scripts/tier2/headless-gnome-spike.sh \
            scripts/tier2/prove-smoke.sh

      - name: Can the packaged session open and reuse a resident window?
        run: |
          scripts/tier2/headless-gnome-spike.sh \
            scripts/tier2/session.sh

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-probe-logs-gnome${{ matrix.gnome }}
          path: |
            /tmp/gnome-shell.log
            /tmp/wayland-info.txt
            /tmp/tier2-session.log
          if-no-files-found: warn
          retention-days: 7
