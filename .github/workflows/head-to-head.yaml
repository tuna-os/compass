name: Head-to-head upstream benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: '31 3 * * 1'
  pull_request:
    paths:
      - 'justfile'
      - 'scripts/bench/**'
      - '.github/workflows/head-to-head.yaml'
  push:
    branches: [main]
    paths:
      - 'justfile'
      - 'scripts/bench/**'
      - '.github/workflows/head-to-head.yaml'

permissions:
  contents: read

concurrency:
  group: head-to-head-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: just
      - name: Runner prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman
      - name: Exercise orchestration failure paths
        run: just bench-check
      - name: Run the same entrypoint as a developer
        run: just bench-head-to-head
      - name: Publish summary
        if: success()
        run: |
          find target/head-to-head -name summary.md -exec cat {} + >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve measurements and failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-head-to-head-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            target/head-to-head/run-*/*.json
            target/head-to-head/run-*/*.md
            target/head-to-head/run-*/*.log
            target/head-to-head/run-*/*.txt
