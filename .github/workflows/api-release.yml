name: API Publish

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

# The default for every job in this file. Jobs that need more say so
# themselves, and a job-level block REPLACES this one rather than adding to it —
# so an elevated job must restate `contents: read` if it also checks out code.
#
# The point is what happens to the NEXT job somebody adds here: without this it
# inherits the repository default, which may be write-all. With it, a new job
# has to ask.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ./src/typescript/api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm (trusted publishing requires >= 11.5.1)
        run: npm install -g npm@latest && npm --version

      - name: Set version from tag
        run: |
          TAG_NAME="${{ inputs.tag }}"

          if [ -z "$TAG_NAME" ]; then
            echo "Error: No tag specified."
            exit 1
          fi

          npm version "$TAG_NAME" --no-git-tag-version

      - name: Install dependencies
        run: npm ci
      - name: Build package
        run: npm run build

      - name: Check if version is already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "@vicinae/api@$VERSION" version 2>/dev/null)" ]; then
            echo "@vicinae/api@$VERSION already published, skipping."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check.outputs.published == 'false'
        run: npm publish
