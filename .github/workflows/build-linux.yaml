name: Build (Linux)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Plain upstream Arch: the build deps are one pacman invocation, so a
    # prebuilt image is not worth a registry dependency. Installed below
    # from the same script the image Dockerfile uses.
    container: archlinux:latest

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - name: GCC
            cc: gcc
            cxx: g++
          - name: Clang
            cc: clang
            cxx: clang++

    name: Build (${{ matrix.compiler.name }})

    steps:
      # actions/checkout silently falls back to a REST tarball with no .git when
      # git is missing, which breaks every later git step. The Depot image had
      # git baked in; plain archlinux:latest does not.
      - name: Bootstrap git
        run: pacman -Sy --needed --noconfirm git

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: ./scripts/runners/arch/install-deps.sh

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-${{ matrix.compiler.name }}

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DUSE_SYSTEM_CMARK_GFM=OFF \
            -DCMAKE_C_COMPILER=${{ matrix.compiler.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Lint QML
        run: cmake --build build --target all_qmllint

      - name: Run Tests
        run: make test
