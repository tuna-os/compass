# Builds the Flatpak.
#
# Until this existed, packaging/flatpak/ had been syntax-validated and never built,
# which is a claim about YAML rather than about software. Bluefin is Flatpak-only,
# so this is the format the Rust engine actually ships in and the first tier that
# exercises the real runtime.
name: Flatpak

on:
  push:
    branches: [main]
    paths: &paths
      - packaging/flatpak/**
      - packaging/schema/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - scripts/flatpak/**
      - scripts/packaging/**
      - scripts/build-extension-runtime.sh
      - .github/workflows/flatpak.yaml
  pull_request:
    paths: *paths
  workflow_dispatch:
  # The VM tier calls this workflow so that "how the Flatpak is built" has one
  # definition. The bundle it uploads is what gets layered into the test image.
  workflow_call:

# The literal prefix matters. `github.workflow` in a *called* workflow is the
# CALLER's name, so without it this group would be identical to the VM tier's
# own workflow-level group — and with cancel-in-progress that means the called
# job cancels the run that called it.
concurrency:
  group: flatpak-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The default for every job in this file. Jobs that need more say so
# themselves, and a job-level block REPLACES this one rather than adding to it —
# so an elevated job must restate `contents: read` if it also checks out code.
#
# The point is what happens to the NEXT job somebody adds here: without this it
# inherits the repository default, which may be write-all. With it, a new job
# has to ask.
permissions:
  contents: read

jobs:
  # Cheap and fails fast. The crate list is derived entirely from Cargo.lock, so a
  # dependency change without a regeneration makes the build below fail with a
  # missing-crate error that reads like a registry outage rather than "you forgot
  # to run the script". Catch it here, where the message says what to do.
  sources-are-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate and compare
        run: |
          python3 -m pip install --quiet aiohttp tomlkit PyYAML
          ./scripts/flatpak/gen-cargo-sources.sh /tmp/fresh.json
          if ! diff -u packaging/flatpak/cargo-sources.json /tmp/fresh.json; then
            echo "::error::packaging/flatpak/cargo-sources.json is stale. Run scripts/flatpak/gen-cargo-sources.sh and commit the result."
            exit 1
          fi
          echo "cargo-sources.json matches Cargo.lock"

  build:
    runs-on: ubuntu-24.04
    # The freedesktop SDK plus the Rust extension is a large download and the build
    # is a full release compile of the workspace. Generous, but bounded.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak and flatpak-builder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder
          flatpak --version
          flatpak-builder --version

      - name: Add flathub
        run: flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo

      # Keyed on the manifest, since that is what names the runtime versions.
      # Caches the runtime, and unavoidably the installed applications with it:
      # ~/.local/share/flatpak holds both. Keyed on the manifest, which barely
      # changes — so a com.vicinae.Vicinae installed by an earlier run comes
      # back, and `flatpak install` finds it already present and does nothing.
      # That is not hypothetical: this job spent a run testing a binary built
      # before `spike` existed and reporting `unrecognized subcommand 'spike'`.
      # See --reinstall and the commit assertion below, which are what make the
      # cache safe to keep.
      - name: Cache the runtime
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtime-${{ runner.os }}-${{ hashFiles('packaging/flatpak/com.vicinae.Vicinae.yaml') }}
          restore-keys: flatpak-runtime-${{ runner.os }}-

      - name: Install the runtime and SDK
        run: |
          flatpak install --user --noninteractive --or-update flathub \
            org.freedesktop.Platform//26.08 \
            org.freedesktop.Sdk//26.08 \
            org.freedesktop.Sdk.Extension.rust-stable//26.08 \
            org.freedesktop.Sdk.Extension.node22//26.08

      # This step earned its keep on the very first run: the build failed with
      # "rustc 1.89.0 is not supported ... requires rustc 1.94" after vendoring all
      # 161 crates, and this line is what made that a one-minute diagnosis.
      #
      # The three versions are deliberately different things. `rust-toolchain.toml`
      # is what we develop on. `rust-version` in Cargo.toml is the minimum we
      # promise, and it is set by the SDK because the SDK is the binding constraint.
      # If the SDK's rustc ever drops below our declared MSRV, this is the line that
      # says so.
      - name: What Rust does the SDK actually ship?
        run: |
          echo "dev pin (rust-toolchain.toml): $(grep -oP 'channel\s*=\s*"\K[^"]+' rust-toolchain.toml || echo 'none')"
          echo "declared MSRV (Cargo.toml):    $(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          echo -n "SDK ships:                     "
          flatpak run --user --command=sh --devel org.freedesktop.Sdk//26.08 \
            -c 'PATH=/usr/lib/sdk/rust-stable/bin:$PATH rustc --version' || echo "could not query"

      # The manifest installs this from the source tree, because the offline
      # build cannot run figura or npm. Same script, same C++23 need, as the
      # Rust workflow's extension-runtime job.
      - name: Build the extension runtime bundle
        env:
          CXX: g++-14
        run: |
          sudo apt-get install -y g++-14
          ./scripts/build-extension-runtime.sh
          test -s src/typescript/extension-manager/dist/runtime.js

      - name: Build
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --repo=/tmp/repo --state-dir=/tmp/fb-state \
            /tmp/build packaging/flatpak/com.vicinae.Vicinae.yaml

      - name: Install it and run the binary
        # Building proves it compiles and installs. Running `doctor` proves the
        # result actually starts inside the sandbox, which is a different claim and
        # the one that matters. --check-only is deliberately NOT used: a CI container
        # has no desktop, so checks will legitimately fail; the assertion is that the
        # binary runs and produces a report, not that the report is clean.
        run: |
          # --reinstall, not a plain install: see the cache step. Without it a
          # cached copy wins and every assertion below is about the wrong build.
          flatpak install --user --noninteractive --reinstall /tmp/repo com.vicinae.Vicinae

          # And then prove it, rather than trusting the flag. These two commits
          # must be equal; if they are not, the job is testing something other
          # than what it just built, which is exactly the failure this guards.
          built="$(ostree --repo=/tmp/repo rev-parse app/com.vicinae.Vicinae/$(flatpak --default-arch)/master)"
          installed="$(flatpak info --user --show-commit com.vicinae.Vicinae)"
          echo "built     $built"
          echo "installed $installed"
          if [ "$built" != "$installed" ]; then
            echo "::error::the installed Flatpak is not the one this job built"
            exit 1
          fi

          # Extensions need both halves inside the sandbox, not on the runner.
          flatpak run --user --command=sh com.vicinae.Vicinae -c \
            'node --version && test -s /app/share/vicinae/extension-runtime.js && test -x /app/libexec/vicinae/compass-sandbox-exec' \
            || { echo "::error::the Flatpak cannot run extensions: Node, the runtime bundle or compass-sandbox-exec is missing"; exit 1; }
          flatpak run --user --command=sh com.vicinae.Vicinae -c \
            'test -s /app/share/vicinae/builtin-icons/question-mark-circle.svg' \
            || { echo "::error::the Flatpak does not ship the builtin icons extensions draw with"; exit 1; }

          flatpak run --user com.vicinae.Vicinae --socket /tmp/ci.sock doctor --json | tee /tmp/doctor.json
          python3 -c "
          import json, sys
          report = json.load(open('/tmp/doctor.json'))
          checks = report['checks']
          assert checks, 'doctor produced no checks'
          print(f'{len(checks)} checks ran inside the sandbox')
          for c in checks:
              print(f\"  {c['status']:5} {c['name']}\")
          "

      # Suite 5 (PLAN.md section 8.6), the same script every other output
      # runs: the installed tree has every file where the engine looks, and a
      # started engine answers ping. The layout is checked on the host through
      # the deploy directory, which is /app inside the sandbox. The socket
      # lives in $XDG_RUNTIME_DIR/app/<id>, the one runtime directory every
      # instance of an app shares -- each `flatpak run` has its own /tmp.
      - name: "Suite 5: layout, version, doctor, ping"
        run: |
          app="$(flatpak info --user --show-location com.vicinae.Vicinae)/files"
          runtime_dir="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/app/com.vicinae.Vicinae"
          mkdir -p "$runtime_dir"
          REQUIRE_RUNTIME=1 ./scripts/packaging/smoke.sh \
            --prefix "$app" --keep-env --socket "$runtime_dir/ci.sock" \
            -- flatpak run --user com.vicinae.Vicinae

      # Spike B (#3), and the reason it lives here rather than only in the VM
      # tier: the question is whether Landlock and seccomp nest inside
      # bubblewrap's sandbox, and this is a real Flatpak — same bwrap, same
      # dropped privileges, same pre-installed seccomp filter. It answers in
      # three minutes where the VM takes twenty-five. The VM still runs it too,
      # because the kernel differs and Landlock's ABI is a kernel property.
      #
      # Not gated. Every outcome is a finding, including "neither confines a
      # process here" — which would be a fact about Phase 4's design rather than
      # a broken build.
      - name: "Spike B: does a sandbox nest inside the Flatpak?"
        run: |
          flatpak run --user com.vicinae.Vicinae spike sandbox | tee /tmp/spike-b.txt
          flatpak run --user com.vicinae.Vicinae spike sandbox --json > /tmp/spike-b.json
          python3 - <<'PY'
          import json
          r = json.load(open('/tmp/spike-b.json'))
          assert r['in_flatpak'], "not inside a Flatpak — this run answers the wrong question"
          # The one thing worth failing on: a filter the kernel says is loaded
          # while the call it blocks still succeeds means the spike is wrong,
          # not the platform. That distinction is the whole value of the field.
          if r['seccomp_applied'] and r['seccomp_denies_blocked_syscall'] is False:
              print(f"::warning::seccomp loaded ({r['seccomp_mode']}) but inert — "
                    "check the blocked syscall numbers before believing this")
          print('verdict evidence:', json.dumps({k: r[k] for k in (
              'kernel', 'landlock_status', 'landlock_denies_outside',
              'seccomp_mode', 'seccomp_denies_blocked_syscall')}, indent=2))
          PY

      - name: Upload the Spike B report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-b-flatpak
          path: /tmp/spike-b.*
          retention-days: 14
          if-no-files-found: warn

      # A single file, not the ostree repo. The VM tier consumes this through the
      # artifact store, and a repo is thousands of small files whose on-disk modes
      # an artifact round trip does not promise to preserve; a bundle is one blob
      # that `flatpak install --bundle` takes offline. It is also what a human
      # would be handed to try a build.
      - name: Export a single-file bundle
        run: |
          flatpak build-bundle /tmp/repo /tmp/com.vicinae.Vicinae.flatpak com.vicinae.Vicinae
          ls -lh /tmp/com.vicinae.Vicinae.flatpak

      - name: Upload the bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: /tmp/com.vicinae.Vicinae.flatpak
          retention-days: 14
          if-no-files-found: error

      - name: Upload the repo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-repo
          path: /tmp/repo
          retention-days: 7
          if-no-files-found: warn
