name: Build Arch build-env image

on:
  schedule:
    - cron: "0 4 * * 1"
  push:
    branches: [main]
    paths:
      - scripts/runners/arch/base.Dockerfile
      - .github/workflows/build-arch-image.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Required to push to GitHub Container Registry.
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          context: scripts/runners/arch
          file: scripts/runners/arch/base.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/build-env:arch-latest
          # GitHub-hosted runners have no persistent layer cache, so carry one
          # through the registry. Without it every scheduled rebuild is cold.
          cache-from: type=gha
          cache-to: type=gha,mode=max
