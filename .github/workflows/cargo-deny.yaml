# cargo-deny against deny.toml: RustSec advisories, licences, duplicate
# versions and where crates may come from.
#
# Advisories are a separate leg because they change without any change here:
# a crate published years ago can gain an advisory tonight. On a pull request
# that leg reports without blocking, so an unrelated change is not held up by
# news about a dependency it did not touch; on main and on the daily schedule it
# fails, which is where somebody has to act on it. The other checks only change
# when Cargo.lock or deny.toml does, so they always gate.
name: cargo-deny

on:
  push:
    branches: [main]
    paths: &paths
      - Cargo.lock
      - "**/Cargo.toml"
      - deny.toml
      - .github/workflows/cargo-deny.yaml
  pull_request:
    paths: *paths
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    continue-on-error: ${{ matrix.checks == 'advisories' && github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check ${{ matrix.checks }}
