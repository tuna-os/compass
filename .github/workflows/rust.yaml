name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Deliberately no job-level `RUSTFLAGS: -D warnings`: RUSTFLAGS applies to
  # dependencies too, so a new warning in any upstream crate would fail our
  # build for something we cannot fix. The clippy step below carries
  # `-D warnings`, which is scoped to our own code.

# The default for every job in this file. Jobs that need more say so
# themselves, and a job-level block REPLACES this one rather than adding to it —
# so an elevated job must restate `contents: read` if it also checks out code.
#
# The point is what happens to the NEXT job somebody adds here: without this it
# inherits the repository default, which may be write-all. With it, a new job
# has to ask.
permissions:
  contents: read

jobs:
  check:
    name: Build, lint and test
    runs-on: ubuntu-24.04
    # A hung build or test fails here instead of holding a runner for the
    # six-hour default (#329). Well above the §8.8 budget, so a cold cache
    # still finishes.
    timeout-minutes: 45

    # §8.8 gives this job an 8 minute budget and names `sccache` +
    # `cargo-nextest` as what keeps it honest. sccache caches compilation
    # keyed on preprocessed input, so a PR that touches one crate stops
    # rebuilding the dependency graph behind it; the GHA backend keeps that
    # cache across runs without a self-hosted store.
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache

    steps:
      - name: Checkout code
        uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false

      # #330: Rust files over 1500 lines that are not in
      # scripts/architecture/allowlist.txt get a warning annotation. Advisory
      # until the god-object splits (#258, #292, #294) land, so warnings exit 0
      # and the step cannot fail the job; the selftest runs first so a checker
      # that stopped seeing oversized files is not mistaken for a clean tree.
      - name: Module size report (advisory)
        continue-on-error: true
        run: |
          python3 scripts/architecture/module-size.py --selftest
          python3 scripts/architecture/module-size.py

      # `iced_layershell` (the wlroots launcher surface) builds
      # smithay-client-toolkit with xkbcommon, found through pkg-config.
      - name: Install the xkbcommon headers
        run: sudo apt-get update -q && sudo apt-get install -y -q libxkbcommon-dev

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.87.22
        with:
          tool: nextest

      # rust-toolchain.toml pins the channel and components.
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Cache cargo
        uses: actions/cache@v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The module docs carry a lot of the reasoning in this repo, and an
      # intra-doc link that stops resolving is invisible to every other gate:
      # `cargo build`, clippy and the tests all pass with a dead `[`Foo`]`.
      # Five had already rotted in `compass::doctor` by the time anyone ran
      # rustdoc over it, four of them from a type the module no longer names.
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      # COMPASS_REQUIRE_DBUS turns compass-shell's "no dbus-daemon, skipping"
      # path into a failure. Suite 3a is 21 tests against a private session
      # bus, and on a runner image without `dbus-daemon` every one of them
      # would skip and the job would still be green -- 21 tests not running
      # looks identical to 21 tests passing. The image ships it today (checked
      # in a run's log), and this is what keeps that from being load-bearing
      # and unstated.
      #
      # `cargo nextest` rather than `cargo test`: it runs each test in its own
      # process and schedules them across cores, which is where §8.8's budget
      # is won back. It deliberately does NOT run doctests -- nextest cannot --
      # which is why the separate Doctests step below is load-bearing rather
      # than belt-and-braces.
      - name: Test
        run: cargo nextest run --workspace --all-targets
        env:
          COMPASS_REQUIRE_DBUS: "1"

      # --all-targets skips doctests, so run them separately.
      # The §8.5 SLAs are release properties, and `cargo test` above is a debug
      # build. Without this step the fuzzy-search budget would take its debug
      # branch — a 60 ms sanity ceiling — and the real 2 ms SLA would never run
      # in CI at all.
      #
      # Which is exactly the defect this work was fixing. §8.5's benches claimed
      # to be "enforced as CI failures" while no job ran `cargo bench`; adding a
      # release-only assertion that CI also never runs would have reproduced it
      # one layer down.
      #
      # Scoped to the two budget tests rather than the workspace: a cold release
      # build of just these is about twelve seconds, against minutes for
      # everything including the renderer.
      - name: SLA budgets, in release
        run: |
          cargo test --release -p compass-search --test ranking_budget -- --nocapture
          cargo test --release -p compass-ipc --test roundtrip_budget -- --nocapture

      - name: Doctests
        run: cargo test --workspace --doc

      # Without this the claim "we use sccache" is unverifiable: a wrapper that
      # is silently missing, or a cache that never hits, looks exactly like one
      # that works. The hit rate is the number to read when this job's runtime
      # drifts back up.
      - name: sccache statistics
        if: always()
        run: sccache --show-stats

  # `rust-version` in Cargo.toml is a promise, and an unenforced promise rots.
  #
  # It is also not ours to choose freely: the Flatpak we ship builds inside
  # org.freedesktop.Sdk.Extension.rust-stable, whose compiler is whatever that
  # runtime ships. The first Flatpak build failed exactly here --
  # "rustc 1.89.0 is not supported ... requires rustc 1.94" -- after a full crate
  # vendor, because the declared MSRV had been set to the toolchain we happened to
  # develop on rather than to a version we had tested.
  #
  # This job is the fast version of that discovery: two minutes here instead of
  # forty in the Flatpak job. Scope is deliberately `-p compass` rather than the
  # whole workspace, because it is the *shipped* code that has to build on the
  # SDK's compiler -- tests may use newer features freely.
  msrv:
    name: Builds on the minimum supported Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false

      # `iced_layershell` (the wlroots launcher surface) builds
      # smithay-client-toolkit with xkbcommon, found through pkg-config.
      - name: Install the xkbcommon headers
        run: sudo apt-get update -q && sudo apt-get install -y -q libxkbcommon-dev

      - name: Read the MSRV out of Cargo.toml
        id: msrv
        run: |
          version="$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          test -n "$version" || { echo "::error::no rust-version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "declared MSRV: $version"

      # rust-toolchain.toml would otherwise override the toolchain we ask for.
      - name: Install the MSRV toolchain
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: |
          rustup toolchain install "$MSRV" --profile minimal --no-self-update
          rustup run "$MSRV" rustc --version

      - name: Cache cargo
        uses: actions/cache@v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: msrv-${{ runner.os }}-${{ steps.msrv.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: msrv-${{ runner.os }}-${{ steps.msrv.outputs.version }}-

      - name: Build the shipped binary on the MSRV
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: |
          rustup run "$MSRV" \
            cargo build --release --locked -p compass

  # PHASE 4'S SEAM. The gate (PLAN §6) asks that compass-extension-api compile
  # and pass its tests with compass-worker-host removed from the dependency
  # graph: the cheap mechanical proof that the Rhai tier can bind to the same
  # view tree without the Node host coming along. The script checks the real
  # graph, then builds and tests the crate in a workspace where the host does
  # not exist at all.
  extension-api-seam:
    name: "Phase 4 seam: compass-extension-api without compass-worker-host"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false

      - name: Cache cargo
        uses: actions/cache@v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: seam-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: seam-${{ runner.os }}-

      - name: Build and test the crate alone
        run: ./scripts/ci/extension-api-seam.sh

  crypto-parity:
    name: The two clipboard crypto implementations interoperate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false

      - name: Cache cargo
        uses: actions/cache@v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: crypto-parity-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: crypto-parity-${{ runner.os }}-

      # Same trick as scorer-parity, for the same reason: vicinae::crypto is a
      # standalone static library whose only Linux dependency is OpenSSL, so
      # three translation units give us upstream Vicinae's REAL implementation
      # to test against, with no CMake, no Qt and no server. PLAN.md §8.4a.
      # scripts/bench/upstream holds them verbatim from the pinned release.
      - name: Build the C++ crypto probe
        run: |
          set -o pipefail
          up=scripts/bench/upstream/crypto
          c++ -std=c++23 -O2 -I$up/include -I$up/src \
            -o /tmp/vicinae-crypto-probe scripts/bench/probes/crypto-probe.cpp \
            $up/src/aes-gcm.cpp $up/src/kdf.cpp $up/src/gcm-openssl.cpp -lcrypto
          # Asserted, because a probe that built but could not answer would
          # otherwise surface as "no divergences" -- the harness's own failure
          # looking like success. This is a fixed HKDF-SHA256 vector, so it also
          # catches an OpenSSL that links but computes something else.
          expected=d6a1eec1713edd7472e1477cbe7beece6c36d9394d677f6a79447e63018544d4
          got=$(printf 'derive 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f 636c6970626f617264\n' \
            | /tmp/vicinae-crypto-probe)
          test "$got" = "ok $expected" \
            || { echo "::error::the probe answered '$got', expected 'ok $expected'"; exit 1; }

      - name: Cross-decrypt the two implementations
        run: |
          cargo run --locked -p compass-testkit --bin crypto-parity -- \
            --probe /tmp/vicinae-crypto-probe

      - name: What this proves, and what it does not
        if: always()
        run: |
          echo 'This is the CRYPTO, not the clipboard store. clipboard-db.hpp and'
          echo 'clipboard-encrypter.cpp wrap it in a SQLite schema, key management'
          echo 'and a mime model, none of which is exercised here. Format parity is'
          echo 'necessary for the Phase 3 gate -- "readable and writable by both'
          echo 'engines interchangeably" -- and is not the whole of it.'
          echo
          echo 'It is also not a byte-diff, deliberately: the IV is random, so two'
          echo 'CORRECT implementations differ on every call. Each engine decrypts'
          echo "what the other wrote instead, which is what interchangeable means."

  scorer-parity:
    name: The two scorers agree on the corpus
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false

      - name: Cache cargo
        uses: actions/cache@v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: scorer-parity-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: scorer-parity-${{ runner.os }}-

      # No CMake, no Qt, no server, no display. vicinae::fuzzy is a header-only
      # INTERFACE library, which is the entire reason this tier-1 job can diff
      # against upstream Vicinae's real scorer (scripts/bench/upstream, verbatim
      # from the pinned release) for the price of one translation unit.
      # PLAN.md §8.1a.
      - name: Build the C++ scorer probe
        run: |
          set -o pipefail
          c++ -std=c++23 -O2 -Iscripts/bench/upstream/fuzzy/include \
            -o /tmp/vicinae-fuzzy-probe scripts/bench/probes/fuzzy-probe.cpp
          # Asserted, because a probe that cannot run would otherwise surface as
          # "no divergences" — the harness's own failure looking like success.
          printf 'a\tSystem Monitor\n' | /tmp/vicinae-fuzzy-probe Sy | grep -q '^a' \
            || { echo "::error::the probe built but does not score"; exit 1; }

      - name: Diff the C++ scorer against the Rust one
        run: |
          cargo run --locked -p compass-testkit --bin scorer-parity -- \
            --probe /tmp/vicinae-fuzzy-probe

      - name: What this proves, and what it does not
        if: always()
        run: |
          echo 'This diffs the SCORER, not the engines. RootItemManager wraps it'
          echo 'in provider bucketing, a provider-name score, favourite and'
          echo 'enabled filtering, and per-item frecency, none of which is'
          echo 'exercised here. Scorer parity is necessary for the ranking'
          echo 'parity Phase 1 gates on, and is not the same thing — that needs'
          echo 'a ranked-output path in the C++ engine (PLAN.md §8.1a rung 2).'

  # The one job that runs the REAL extension runtime against the Rust host.
  #
  # Everything else in this file tests the host against itself or against a
  # mock worker that speaks the same wire format — which is a claim about the
  # format, not about the runtime an extension actually runs inside. This job
  # builds `src/typescript/extension-manager`'s bundle (esbuild bundles the
  # committed protocol bindings) and drives a real no-view command through it,
  # so `Storage/set` and `Storage/get` cross a pipe between two independent
  # implementations.
  #
  # COMPASS_REQUIRE_RUNTIME turns the test's "no bundle, skipping" path into a
  # failure. Without it a broken build would look exactly like a passing test,
  # which is the failure mode this job exists to rule out.
  extension-runtime:
    name: The real extension runtime drives the host
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false

      # `iced_layershell` (the wlroots launcher surface) builds
      # smithay-client-toolkit with xkbcommon, found through pkg-config.
      - name: Install the xkbcommon headers
        run: sudo apt-get update -q && sudo apt-get install -y -q libxkbcommon-dev

      - name: Cache cargo
        uses: actions/cache@v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: runtime-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: runtime-${{ runner.os }}-

      - name: Build the extension runtime
        run: ./scripts/build-extension-runtime.sh

      # The runtime's own unit tests (the macOS shim), on Node's test runner
      # over esbuild bundles: nothing to install beyond what the build did.
      - name: Test the runtime
        working-directory: src/typescript/extension-manager
        run: npm test

      - name: Drive it from the host
        env:
          COMPASS_REQUIRE_RUNTIME: "1"
        run: cargo test -p compass-worker-host --test real_runtime -- --nocapture

      # The engine end to end: an installed extension's no-view command found
      # by a query and run through the socket, behind compass-sandbox-exec,
      # which the engine looks for beside its own binary. The command also
      # tries a write outside its directories, and the test requires EACCES.
      - name: The engine runs an installed extension, confined
        env:
          COMPASS_REQUIRE_RUNTIME: "1"
        run: |
          cargo build -p compass -p compass-sandbox --bins
          cargo test -p compass --test engine_end_to_end an_installed_extension -- --nocapture

      - name: Building it must not dirty the tree
        run: |
          # `npm ci` rather than `npm install`, and generated protos are
          # gitignored: a lockfile rewritten by the build would otherwise land
          # in somebody's next commit.
          git diff --exit-code || {
            echo "::error::building the runtime modified tracked files"
            exit 1
          }

  # Suite 4 (the SLA benches), the per-commit idle RSS and the regression gate
  # that judges both live in perf.yaml, which also runs on a schedule so the
  # gate's baseline fills without rerunning everything here.

  paint-tier:
    name: "Paint tier: the launcher rendered, on wgpu and on tiny-skia"
    runs-on: ubuntu-24.04
    # Measured: ~3 s to render and check per backend. The budget is the
    # compile, not the test.
    timeout-minutes: 20

    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache

    steps:
      - uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false

      # `iced_layershell` (the wlroots launcher surface) builds
      # smithay-client-toolkit with xkbcommon, found through pkg-config.
      - name: Install the xkbcommon headers
        run: sudo apt-get update -q && sudo apt-get install -y -q libxkbcommon-dev

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo
        uses: actions/cache@v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: paint-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: paint-${{ runner.os }}-

      # Lavapipe: Mesa's software Vulkan driver. It gives wgpu a real
      # adapter on a runner with no GPU, so the GPU shader pipeline --
      # the path a real desktop takes -- is exercised rather than skipped.
      - name: Install a software Vulkan driver
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mesa-vulkan-drivers
          ls /usr/share/vulkan/icd.d/lvp_icd.json

      # BOTH BACKENDS, EACH FORCED, EACH CHECKED.
      #
      # Iced tries wgpu first and falls back to tiny-skia without a word.
      # Right for an application, wrong for a test: a job meant to prove
      # wgpu could pass on tiny-skia and report nothing amiss.
      #
      #   ICED_TEST_BACKEND     forces the choice; wgpu with no adapter
      #                         panics rather than falling back
      #   PAINT_EXPECT_BACKEND  makes the suite confirm it got what it
      #                         asked for, so a future change to Iced's
      #                         fallback cannot reintroduce the swap
      - name: Paint on wgpu (the GPU shader pipeline, via lavapipe)
        env:
          ICED_TEST_BACKEND: wgpu
          PAINT_EXPECT_BACKEND: wgpu
        run: cargo test --locked -p compass-ui --test paint -- --nocapture

      - name: Paint on tiny-skia (the CPU rasteriser Iced falls back to)
        env:
          ICED_TEST_BACKEND: tiny-skia
          PAINT_EXPECT_BACKEND: tiny-skia
        run: cargo test --locked -p compass-ui --test paint -- --nocapture

  suite0-selftest:
    name: "Suite 0: the parity harness runs at all"
    runs-on: ubuntu-24.04
    # Measured: ~90 s to build the engine from a warm cache, ~70 s for 1817
    # queries against two engines. The margin is for a cold cache.
    timeout-minutes: 20

    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache

    steps:
      - uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false

      # `iced_layershell` (the wlroots launcher surface) builds
      # smithay-client-toolkit with xkbcommon, found through pkg-config.
      - name: Install the xkbcommon headers
        run: sudo apt-get update -q && sudo apt-get install -y -q libxkbcommon-dev

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo
        uses: actions/cache@v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: suite0-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: suite0-${{ runner.os }}-

      - name: Build the engine the harness drives
        run: cargo build --locked --release -p compass

      # WHY A SELF-TEST AND NOT THE PARITY RUN ITSELF
      #
      # The real differential needed the in-tree C++ engine, removed with
      # ADR-0021; unmodified upstream releases have no ranked-query endpoint to
      # stand in for it (HEAD-TO-HEAD.md). So this runs the Rust engine on
      # BOTH sides.
      #
      # It cannot show the two engines agree -- an engine agrees with itself.
      # It shows the HARNESS works end to end: staging the corpus where an XDG
      # engine looks, starting two servers on isolated sockets, polling each
      # until it ranks rather than sleeping, querying, parsing and comparing.
      # None of which had ever been exercised: the first run of this harness
      # panicked on the first accented name in the corpus, before comparing a
      # single query.
      #
      # `--selftest` refuses a run in which nothing ranked, which is the only
      # way self-parity can pass while measuring nothing.
      - name: The harness must complete a run, and must have ranked something
        run: |
          set -o pipefail
          cargo run --locked --release -p compass-testkit --bin parity -- \
            --selftest \
            --cpp target/release/compass \
            --rust target/release/compass | tee "$GITHUB_STEP_SUMMARY"
