# Publishes the Flatpak to the TunaOS remote (https://tunaos.org/flatpak/).
#
# It does not build anything. flatpak.yaml is the one definition of how the
# Flatpak is built, and it already builds, installs and smoke-tests it on every
# push to main that touches the engine, once per architecture on a native
# runner. This takes the single-file bundles that run uploaded (x86_64 and
# aarch64), turns each into the OCI image the remote serves, pushes them to
# ghcr.io/tuna-os/compass, and records their digests in the remote's index,
# which lives in tuna-os/docs (static/flatpak/index/static).
#
# Rebuilding here instead would mean a second copy of the build — the
# extension runtime step, the runtime cache, the SDK versions — that drifts
# from the first. Publishing what was tested is also the point.
#
# The app ID is org.tunaos.compass (ADR-0020); the registry path is
# tuna-os/compass. The index keys on the registry path, so they need not match.
name: Publish Flatpak

on:
  workflow_run:
    workflows: [Flatpak]
    types: [completed]
  workflow_dispatch:
    inputs:
      run-id:
        description: A successful Flatpak run on main to publish (default the latest)
        required: false

concurrency:
  group: publish-flatpak
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # Only a green build of main, and only a push or a manual run of it: a
    # pull request's bundle, or the one the VM tier builds, is never published.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      APP_ID: org.tunaos.compass
      IMAGE: ghcr.io/tuna-os/compass
      ARCHS: x86_64 aarch64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Which run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN: ${{ github.event.workflow_run.id }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_RUN: ${{ inputs.run-id }}
        run: |
          run="${EVENT_RUN:-$INPUT_RUN}"
          if [ -z "$run" ]; then
            run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow flatpak.yaml \
                     --branch main --status success --limit 1 \
                     --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$run" || { echo "::error::no successful Flatpak run on main to publish"; exit 1; }
          sha="${EVENT_SHA:-$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)}"
          test -n "$sha" || { echo "::error::could not tell which commit run $run built"; exit 1; }
          echo "id=$run" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "publishing the bundle from run $run, built from $sha"

      # flatpak.yaml builds each architecture on its own native runner and
      # uploads its bundle: flatpak-bundle for x86_64, flatpak-bundle-aarch64
      # for aarch64. Both are required; a run from before aarch64 was built has
      # no second bundle, and publishing half of a release would leave the
      # remote's arches out of step.
      - name: Download the x86_64 bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: flatpak-bundle
          path: bundle/x86_64
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}

      - name: Download the aarch64 bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: flatpak-bundle-aarch64
          path: bundle/aarch64
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}

      - name: Install flatpak and skopeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak ostree skopeo

      # The bundle carries the commit flatpak-builder made, including the
      # AppStream data and icons it composed from our metainfo. build-bundle
      # --oci writes those into the image config as org.freedesktop.appstream.*
      # labels, which is where a software centre reads the app's name, icon and
      # licence from on an OCI remote.
      #
      # Importing a bundle and exporting it again only moves ostree objects, so
      # the aarch64 one is handled on this x86_64 runner like the other: nothing
      # here executes the app.
      #
      # Those labels are not enough for Bazaar. It reads a cached icon only from
      # icons/flatpak/<size>/, which an ostree remote's appstream has and an OCI
      # remote's does not, so it needs a remote icon URL as well.
      # scripts/flatpak/appstream-icons.py explains why, adds one that points at
      # the PNGs committed in the commit that was built, and checks that the URL
      # serves the same PNG as the label.
      - name: Export the OCI images
        env:
          ICON_URL_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.run.outputs.sha }}/packaging/flatpak/icons
        run: |
          ostree --repo=repo init --mode=archive-z2
          for arch in $ARCHS; do
            flatpak build-import-bundle repo "bundle/$arch/$APP_ID.flatpak"
            flatpak build-bundle --oci --arch="$arch" repo "oci-$arch" "$APP_ID"
            python3 scripts/flatpak/appstream-icons.py add-remote "oci-$arch" --url-base "$ICON_URL_BASE"
            python3 scripts/flatpak/appstream-icons.py check-oci "oci-$arch" --url-base "$ICON_URL_BASE" --fetch
            python3 - "oci-$arch" "$arch" <<'PY'
          import json, pathlib, sys
          oci, arch = pathlib.Path(sys.argv[1]), sys.argv[2]
          blobs = oci / 'blobs' / 'sha256'
          digest = json.loads((oci / 'index.json').read_text())['manifests'][0]['digest']
          manifest = json.loads((blobs / digest.split(':')[1]).read_text())
          config = json.loads((blobs / manifest['config']['digest'].split(':')[1]).read_text())
          labels = sorted(config['config']['Labels'])
          print(arch, digest, config.get('architecture'))
          print('\n'.join('  ' + label for label in labels))
          oci_arch = {'x86_64': 'amd64', 'aarch64': 'arm64'}[arch]
          if config.get('architecture') != oci_arch:
              raise SystemExit(f'{arch} image says architecture={config.get("architecture")!r}, expected {oci_arch}')
          missing = [l for l in ('org.freedesktop.appstream.appdata', 'org.freedesktop.appstream.icon-128') if l not in labels]
          if missing:
              raise SystemExit(f'no AppStream labels on the {arch} image: {missing}; software centres would show a bare app id')
          PY
          done

      # The org's tag convention (tuna-os/.github's reusable publish-flatpak):
      # latest-<arch> for each architecture, and plain latest tracking x86_64
      # for anything that pulls by tag without knowing about the suffix.
      - name: Push to GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "$GITHUB_TOKEN" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          for arch in $ARCHS; do
            skopeo copy "oci:oci-$arch" "docker://$IMAGE:latest-$arch"
          done
          skopeo copy oci:oci-x86_64 "docker://$IMAGE:latest"

      # The org's shared step: clones tuna-os/docs, updates this app's entry in
      # static/flatpak/index/static and pushes, retrying when another app's
      # publish lands first. Once per architecture, as the reusable workflow
      # does: the index keeps one image per architecture under a repo name.
      - name: Update the remote's index (tuna-os/docs), x86_64
        uses: tuna-os/.github/.github/actions/publish-flatpak-index@main
        with:
          oci-dir: oci-x86_64
          repo-name: tuna-os/compass
          tags: latest
          token: ${{ secrets.FLATPAK_INDEX_TOKEN }}

      - name: Update the remote's index (tuna-os/docs), aarch64
        uses: tuna-os/.github/.github/actions/publish-flatpak-index@main
        with:
          oci-dir: oci-aarch64
          repo-name: tuna-os/compass
          tags: latest
          token: ${{ secrets.FLATPAK_INDEX_TOKEN }}
