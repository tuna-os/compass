# Tier 1 for the shell we ship.
#
# The VM tier's assertions are a shell script baked into a test image and a
# Python heredoc inside it. Both are only executed 30 minutes into a VM run, on
# a nightly schedule — so a quoting mistake in either would be found by the
# slowest, least frequent job we have. This finds it in ten seconds instead, and
# is what packaging/vmtest/checks.sh means when its header says `bash -n` runs
# over it before CI does.
name: Shell

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: shell-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The default for every job in this file. Jobs that need more say so
# themselves, and a job-level block REPLACES this one rather than adding to it —
# so an elevated job must restate `contents: read` if it also checks out code.
#
# The point is what happens to the NEXT job somebody adds here: without this it
# inherits the repository default, which may be write-all. With it, a new job
# has to ask.
permissions:
  contents: read

jobs:
  lint:
    name: Parse and lint every script we own
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # An explicit list of directories, not `find . -name '*.sh'` and not even
      # all of scripts/. This repository is a fork carrying the whole C++ tree,
      # and its inherited scripts have their own shellcheck warnings that are
      # not this project's to fix — failing the build on somebody else's shell
      # is how a lint job gets turned off. These directories are the ones
      # the Rust port added, so a warning in them is ours and is a defect.
      # scripts/runners/bluefin is named specifically rather than
      # scripts/runners, because that directory also holds the inherited arch/
      # and appimage/ scripts, which are not.
      #
      # THIS LIST IS THE COST OF THAT PRECISION: a new directory of our own
      # scripts is NOT covered until it is named here, and nothing fails to
      # remind you. `scripts/tier2` was added in the same change that created
      # it, after noticing its spike script would otherwise have shipped
      # unshellchecked — which is the same defect shape as a path filter that
      # matches nothing.
      #
      # Written to a file rather than a step output, so nothing this job runs is
      # assembled by string-interpolating a path into a shell command.
      - name: Collect
        run: |
          find packaging/vmtest packaging/appimage scripts/vmtest scripts/tier2 scripts/flatpak scripts/packaging scripts/runners/bluefin -name '*.sh' -type f | sort > /tmp/ours.txt
          test -s /tmp/ours.txt || { echo "::error::no scripts found — the paths have moved"; exit 1; }
          sed 's/^/  /' /tmp/ours.txt

      - name: bash -n
        run: |
          status=0
          while read -r f; do
            if bash -n "$f"; then echo "ok   $f"; else echo "::error file=$f::bash -n failed"; status=1; fi
          done < /tmp/ours.txt
          exit $status

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --version | head -2
          # -S warning, not the default: style advice on a script that works is
          # not worth a red build, while a warning here is a real defect class
          # (unquoted expansion, masked exit status).
          xargs -a /tmp/ours.txt shellcheck -S warning

      # Shell we own whose file names do not end in .sh, so the find above
      # cannot see them. A PKGBUILD's variables are read by makepkg, not by
      # the file itself, hence the three exclusions for that file only.
      - name: shellcheck the packaging scripts without a .sh name
        run: |
          bash -n packaging/appimage/AppRun
          bash -n packaging/arch/PKGBUILD
          shellcheck -S warning packaging/appimage/AppRun
          shellcheck -S warning --shell=bash --exclude=SC2034,SC2154,SC2164 packaging/arch/PKGBUILD

      # The assertions the VM tier gates on are Python inside a shell heredoc.
      # Nothing else in CI would ever parse them.
      - name: Compile the embedded Python
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          failed = []
          found = 0
          for path in sorted(pathlib.Path(p.strip()) for p in open('/tmp/ours.txt')):
              text = path.read_text()
              for match in re.finditer(r"<<'PY'\n(.*?)\nPY\n", text, re.S):
                  found += 1
                  try:
                      compile(match.group(1), f'{path}:heredoc', 'exec')
                  except SyntaxError as err:
                      failed.append(f'{path}: {err}')
          print(f'{found} embedded Python blocks compiled')
          if not found:
              sys.exit('found no embedded Python — the extraction pattern has drifted')
          for f in failed:
              print(f'::error::{f}')
          sys.exit(1 if failed else 0)
          PY

      # Standalone Python, which the step above does not see: it extracts
      # heredocs from the shell scripts and nothing else. scripts/vmtest gained
      # framediff.py, and a syntax error in it would otherwise surface thirty
      # minutes into a VM run rather than here in ten seconds — which is the
      # entire premise of this workflow.
      # Workflow YAML hides shell from every other check here: a container
      # payload passed as `bash -c '...'` is just a string until its quoting
      # breaks. Two defects of that exact shape have already reached a branch —
      # an inner heredoc terminator matching the outer one, and an apostrophe in
      # the word "Fedora's" closing the payload early. Neither is visible to a
      # YAML parser, and both cost a CI round.
      - name: Parse the shell embedded in workflow YAML
        run: python3 scripts/ci/check-workflow-payloads.py

      # The VM tier's images are built from Containerfiles, and a shell mistake
      # inside a RUN is a 25-minute round trip to find: the image build is the
      # first thing the tier does and the last thing anything else can report
      # on. shellcheck is pointed at *.sh and a Containerfile is not one.
      - name: Parse the shell inside every Containerfile RUN
        run: python3 scripts/ci/check-containerfile-run.py

      # The GNOME Shell extension cannot run here (gnome-shell needs logind),
      # so this is the one check it gets before the VM tier: it must parse as
      # an ES module, and its metadata must be JSON. That it implements the
      # contract is compass-shell's `extension_contract` test.
      - name: Parse the GNOME Shell extension
        run: |
          set -euo pipefail
          ext=extensions/gnome-shell/compass@tuna-os.github.io
          test -f "$ext/extension.js" || { echo "::error::the extension has moved"; exit 1; }
          cp "$ext/extension.js" "$RUNNER_TEMP/extension.mjs"
          node --check "$RUNNER_TEMP/extension.mjs"
          python3 -c "import json, sys; json.load(open(sys.argv[1]))" "$ext/metadata.json"
          echo "extension parses; metadata is JSON"

      - name: Compile the standalone Python
        run: |
          mapfile -t files < <(find packaging/vmtest scripts/vmtest scripts/flatpak scripts/ci scripts/bench scripts/packaging \
            -name '*.py' -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no standalone Python found — the paths have moved"
            exit 1
          fi
          printf '  %s\n' "${files[@]}"
          python3 -m py_compile "${files[@]}"
          echo "${#files[@]} file(s) compiled"

      # Compiling is not running. framediff.py holds the VM tier's only real
      # assertion -- "did a launcher window appear" -- and that assertion was
      # changed to ignore GNOME's top bar after a clock tick failed a run in
      # which the launcher had painted perfectly. An exclusion can quietly gut
      # the thing it is added to, so the gate is exercised here on synthetic
      # frames: it must still fail for a launcher that never drew, for one that
      # drew in the wrong place, and for top-bar noise with no launcher at all.
      #
      # Here rather than in the VM tier because it needs no VM and takes about a
      # second, and because a control that only runs inside the thing it is
      # controlling is not much of a control.
      - name: The launcher gate still fails when it should
        run: python3 scripts/vmtest/framediff-selftest.py
