# TEMPORARY probe, delete once it has answered.
#
# PLAN.md §8.9 asserts GitHub-hosted runners expose no /dev/kvm, citing a 2022
# community discussion. corral's CI docs assert the opposite. The answer decides
# whether the VM test tier needs self-hosted infrastructure or runs on the
# runners we already pay nothing for, so it is worth one minute of CI rather
# than one more confident paragraph.
name: KVM probe

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/kvm-probe.yaml

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Does /dev/kvm exist, and can we use it?
        run: |
          echo "::group::facts"
          echo "runner:  ${{ matrix.runner }}"
          echo "arch:    $(uname -m)"
          echo "kernel:  $(uname -r)"
          echo "nested:  $(cat /sys/module/kvm_intel/parameters/nested 2>/dev/null || cat /sys/module/kvm_amd/parameters/nested 2>/dev/null || echo 'n/a')"
          ls -l /dev/kvm || echo "NO /dev/kvm"
          grep -c -E '^flags.*(vmx|svm)' /proc/cpuinfo || echo "no vmx/svm in cpuinfo"
          echo "::endgroup::"

          sudo apt-get update -qq
          sudo apt-get install -y -qq cpu-checker qemu-system-x86 qemu-system-arm >/dev/null 2>&1 || true
          kvm-ok || true

      # The real question is not whether the device node exists but whether QEMU
      # will accept -enable-kvm, so ask QEMU rather than inferring.
      - name: Will QEMU actually accelerate?
        run: |
          BIN=qemu-system-x86_64
          [ "$(uname -m)" = "aarch64" ] && BIN=qemu-system-aarch64
          echo "accelerators: $($BIN -accel help 2>&1 | tr '\n' ' ')"
          if $BIN -accel help 2>&1 | grep -qw kvm; then
            echo "RESULT: kvm accelerator is offered by $BIN"
          else
            echo "RESULT: kvm NOT offered — this tier would run under TCG"
          fi
