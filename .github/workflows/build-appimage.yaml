name: Build AppImage

# Disabled 2026-09-12: AppImage is not a channel we distribute through, so the
# ghcr build-env image these jobs pull is deliberately not published and every
# run failed at `docker pull ... manifest unknown`. Permanently red checks are
# how a team learns to ignore CI, so the automatic triggers are removed rather
# than the failures tolerated.
#
# Disabled, not deleted: the workflow and scripts/runners/appimage/ still work.
# To bring it back, restore the `push`/`pull_request` triggers below AND publish
# the build-env image by dispatching build-appimage-image.yaml once (it compiles
# GCC 15.2 and Qt 6.10 from source, so expect hours). Re-enabling the triggers
# alone just restores the red.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.target.runner }}
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}/build-env:${{ matrix.target.tag }}
      # ghcr packages are private until published publicly; GITHUB_TOKEN
      # can pull the ones this repository owns. Once the package is made
      # public these credentials and the packages:read scope can go.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        target:
          - arch: amd64
            deploy_arch: x86_64
            runner: ubuntu-24.04
            tag: appimage-amd64-latest
          - arch: arm64
            deploy_arch: aarch64
            runner: ubuntu-24.04-arm
            tag: appimage-arm64-latest

    name: Build AppImage (${{ matrix.target.arch }})

    env:
      INSTALL_DIR: ${{ github.workspace }}/install
      APPIMAGE_EXTRACT_AND_RUN: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: appimage-${{ matrix.target.arch }}
          max-size: 0

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja              \
          -DCMAKE_BUILD_TYPE=Release                \
          -DCMAKE_INSTALL_PREFIX="${INSTALL_DIR}"

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Install
        run: cmake --install build

      - name: Make AppImage
        run: |
          chmod +x ./scripts/mkappimage.sh
          ./scripts/mkappimage.sh "${INSTALL_DIR}" AppDir

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vicinae-${{ matrix.target.deploy_arch }}-${{ github.sha }}.AppImage
          path: "*.AppImage"
          if-no-files-found: error

