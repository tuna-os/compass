# The VM tier: boot the real target and prove the screen painted.
#
# ADR-0010. Tiers 1 and 2 never boot the OS we ship on, and a launcher is a
# system-integration product — portals, session, compositor, Flatpak sandbox —
# so the things most likely to break are exactly the things a container cannot
# exercise.
#
# THIS RUN DELIBERATELY TESTS STOCK BLUEFIN, with none of our software in it.
# The riskiest unknown is whether a GNOME desktop boots and paints under QEMU on
# a hosted runner at all. Layering compass in at the same time would mean a
# failure could be either half. Once this is green, #18 step 2 adds our Flatpak
# on top and the failure is unambiguous.
#
# KVM was measured, not assumed: ubuntu-24.04 has /dev/kvm with nested=1 and
# QEMU offers the kvm accelerator (PLAN.md §8.9). arm64 does not, so x86_64 only.
name: VM tier

on:
  schedule:
    # Nightly. ADR-0010: promote to the merge queue only after it has been
    # stable for a couple of weeks, never straight in.
    - cron: "0 3 * * *"
  workflow_dispatch:
  # Runs on a PR only when something that affects it changes — which includes
  # this file, so the job is exercised by the PR that introduces or edits it
  # rather than shipped unverified and discovered broken at 3am.
  pull_request:
    paths:
      - .github/workflows/vm-tier.yaml
      - packaging/flatpak/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot-bluefin:
    name: Stock Bluefin boots and paints
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # `bootc install to-disk` writes a full OS image, and the Bluefin OCI image
      # is several GB before that. The default runner has ~14 GB free on /, which
      # is not enough; /mnt has far more.
      - name: Make room
        run: |
          echo "before:"; df -h / /mnt | sed 's/^/  /'
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet
          sudo mkdir -p /mnt/corral /mnt/containers
          sudo chown -R "$USER" /mnt/corral /mnt/containers
          echo "after:"; df -h / /mnt | sed 's/^/  /'

      - name: Confirm KVM is actually usable
        # Not a formality. If this silently degrades to TCG the boot takes an
        # order of magnitude longer and times out looking like an image problem.
        run: |
          ls -l /dev/kvm
          sudo apt-get update -qq && sudo apt-get install -y -qq cpu-checker qemu-system-x86
          kvm-ok
          qemu-system-x86_64 -accel help | grep -qw kvm

      - name: Install podman and ffmpeg, with storage on /mnt
        run: |
          sudo apt-get install -y -qq podman ffmpeg
          podman --version
          ffmpeg -version | head -1

          # The Bluefin OCI image is several GB and `bootc install` runs podman as
          # root, whose graphroot defaults to /var/lib/containers/storage on the
          # small root filesystem.
          #
          # Move the BYTES, not the PATH. Pointing graphroot at /mnt via
          # storage.conf looks equivalent and is not: `bootc install to-disk` runs
          # in a privileged container that bind-mounts the *default* location, so
          # the image it was told to install becomes invisible to it and the run
          # dies after partitioning with
          #   OpenImage: reference "[overlay@/var/lib/containers/storage+...]"
          #   does not resolve to an image ID
          # A bind mount satisfies both: the path stays canonical, the space is /mnt's.
          sudo mkdir -p /mnt/containers/storage /var/lib/containers/storage
          sudo mount --bind /mnt/containers/storage /var/lib/containers/storage
          findmnt -no SOURCE,TARGET,FSTYPE /var/lib/containers/storage
          sudo podman info --format 'graphroot={{.Store.GraphRoot}}'
          df -h /var/lib/containers/storage | tail -1

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # Pinned to a commit, not @latest, for two reasons. `vmtest` is NOT IN ANY
      # TAGGED RELEASE -- v0.6.0 (Aug 6) has no cmd/vmtest.go -- so @latest
      # resolves to a corral that fails with `unknown command "vmtest"`, which is
      # exactly how this job failed the first time. And a moving dependency would
      # let our CI change behaviour without a commit of ours, which is the thing
      # pinning exists to prevent.
      #
      # Bump deliberately. When corral cuts a release containing vmtest, this
      # should become that tag.
      - name: Install corral
        env:
          CORRAL_REF: 81529beffa1d108dd18fbc116c0afb90f0a5c630
        run: |
          go install "github.com/tuna-os/corral@${CORRAL_REF}"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          # Fail here rather than 20 minutes later if the pin ever loses vmtest.
          "$HOME/go/bin/corral" vmtest --help >/dev/null
          echo "corral installed at ${CORRAL_REF} and vmtest is present"

      # See packaging/vmtest/Containerfile.bluefin for why this indirection is
      # needed. Short version: corral `podman create`s the image to probe its
      # filesystem, and a bootc OS image has no CMD for podman to accept.
      - name: Add a CMD so podman will create a container from the image
        run: |
          sudo podman build \
            -t localhost/bluefin-testable:ci \
            -f packaging/vmtest/Containerfile.bluefin \
            packaging/vmtest
          sudo podman image inspect localhost/bluefin-testable:ci \
            --format 'Cmd={{.Config.Cmd}}  Size={{.Size}}'

      - name: Boot Bluefin
        env:
          # corral has no CORRAL_HOME: `qemu.VMHome()` is `os.UserHomeDir()` +
          # .local/share/corral/vms, and on Unix that reads $HOME. Overriding HOME
          # is therefore the actual lever for putting a 30 GB disk image somewhere
          # with room for it. `sudo -E` preserves it.
          HOME: /mnt/corral
          TMPDIR: /mnt/corral
        run: |
          mkdir -p /mnt/corral
          # --ready-marker is 'Started .*gdm\.service', not a graphical.target
          # match, because graphical.target is never reached on this image:
          # plymouth-quit-wait.service starts and never finishes with no real
          # display, and it gates the target. GDM itself starts fine, and the
          # captured frames show stddev ~0.36 against corral's 0.02 blank
          # threshold — the desktop is up and drawing. "Started" not "Starting":
          # the latter appears a moment earlier and means only that it was asked to.
          sudo -E "$(which corral)" vmtest bluefin \
            --bootc localhost/bluefin-testable:ci \
            --ready-marker 'Started .*gdm\.service' \
            --require-paint \
            --video \
            --cpu 4 --mem 8G --disk 30G \
            --timeout 30m \
            --artifacts "$GITHUB_WORKSPACE/vmtest-out" \
            --rm
        # Exit codes are per failure class (ADR-0010):
        #   2 this host cannot run it   6 guest never became ready
        #   4 the disk build failed     9 the guest painted nothing

      - name: What the run reported
        if: always()
        run: |
          # corral ran under sudo, so everything it wrote is root-owned and
          # upload-artifact cannot even scandir it (EACCES on vmtest-out/ssh).
          sudo chown -R "$USER" vmtest-out 2>/dev/null || true
          if [ -f vmtest-out/result.json ]; then
            python3 -c "
          import json
          r = json.load(open('vmtest-out/result.json'))
          print(json.dumps(r, indent=2)[:4000])
          "
          else
            echo "no result.json — the run died before writing one"
          fi
          # The targets the guest actually reached. This is the decisive diagnostic
          # for a readiness timeout: the first run matched nothing because the
          # marker was 'Reached target Graphical' while systemd prints the unit
          # name lowercase ("Reached target graphical.target - Graphical
          # Interface."). Printing the real lines means a second timeout is
          # answered by reading, not by guessing again.
          echo '--- targets reached, and the display-manager path ---'
          if [ -f vmtest-out/serial.log ]; then
            # Strip ANSI first. systemd colourises the unit name, so the escape
            # sequence sits between "target " and "network.target" and an
            # un-stripped grep silently reports only the early-boot lines — which
            # is exactly how the previous run's diagnostic misled me.
            sed -e 's/\x1b\[[0-9;?]*[a-zA-Z]//g' -e 's/\x1b\][^\x07\x1b]*(\x07|\x1b\\\\)//g' \
              vmtest-out/serial.log > /tmp/serial-plain.log 2>/dev/null || \
              cp vmtest-out/serial.log /tmp/serial-plain.log
            grep -aoE 'Reached target [A-Za-z0-9._@-]+' /tmp/serial-plain.log | sort -u || true
            echo '--- gdm / plymouth / display ---'
            grep -aiE 'gdm|plymouth|graphical|wayland|greeter' /tmp/serial-plain.log \
              | tail -40 || true
          else
            echo "no serial.log"
          fi
          echo '--- serial console tail ---'
          tail -40 vmtest-out/serial.log 2>/dev/null || echo "no serial.log"

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vmtest-bluefin
          path: vmtest-out/
          retention-days: 14
          if-no-files-found: warn
