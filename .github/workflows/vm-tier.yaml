# The VM tier: boot the real target and prove the screen painted.
#
# ADR-0010. Tiers 1 and 2 never boot the OS we ship on, and a launcher is a
# system-integration product — portals, session, compositor, Flatpak sandbox —
# so the things most likely to break are exactly the things a container cannot
# exercise.
#
# Two jobs, and the split is deliberate:
#
#   boot-bluefin  stock Bluefin, none of our software. The control. If GNOME
#                 stops booting under QEMU on a hosted runner, this is red and
#                 the other job's redness means nothing.
#   boot-compass  Bluefin with our Flatpak in it and a user logged in. This is
#                 the one that can find our bugs.
#
# Keeping the control is what makes a failure in the second job attributable.
#
# KVM was measured, not assumed: ubuntu-24.04 has /dev/kvm with nested=1 and
# QEMU offers the kvm accelerator (PLAN.md §8.9). arm64 does not, so x86_64 only.
name: VM tier

on:
  schedule:
    # Nightly. ADR-0010: promote to the merge queue only after it has been
    # stable for a couple of weeks, never straight in.
    - cron: "0 3 * * *"

  # A manual run on any branch (`just vm-tier`, or Actions → VM tier → Run
  # workflow). The nightly and the release run everything; a dispatch runs
  # what it names, because each job is a KVM runner booting a 30 GB bootc
  # disk and a question about one check should not pay for four VMs.
  workflow_dispatch:
    inputs:
      jobs:
        description: >-
          Which jobs to run: all; control (stock Bluefin, no Compass); compass
          (the checks below in a real session); launcher (open it, look at it,
          type at it); spike-a (the portal's Super+Space). Every one but control
          builds the Flatpak first.
        type: choice
        default: all
        options:
          - all
          - control
          - compass
          - launcher
          - spike-a
      checks:
        description: >-
          The `compass` job's checks: packaging/vmtest/checks.sh subcommands,
          space-separated, run in order. Empty runs the default set.
        type: string
        required: false
        default: installed session shell-extension doctor doctor-assert spike-b

  # Releases. This is the tier that tests what users install, so it runs on the
  # thing users will install. Same `v*` tags `release.yml` builds from, so a
  # tagged release and the tier answering for it are the same commit.
  push:
    tags:
      - "v*"

  # PRs: intentionally no pull_request trigger.
  # VM tier is nightly (03:00 UTC), release tags (v*), and manual workflow_dispatch only.
  # Per user request PRs do not boot VMs — use workflow_dispatch on the branch
  # for a one-off run if needed.

# `cancel-in-progress: true` is this repository's convention for per-ref
# workflows and it is right for the fast ones: a superseded build is wasted
# work. THIS TIER IS DIFFERENT AND THE DIFFERENCE HAS BEEN MEASURED.
#
# It takes upwards of twenty minutes to reach the job that matters -- queue for
# a KVM-capable runner, build the Flatpak, boot three VMs -- and the launcher
# job is last. So any push inside that window kills it before it has said
# anything. On 2026-09-18 runs 186 through 190 were all cancelled that way
# while a branch was under active development; run 188 got as far as booting
# Bluefin and its "The launcher opens in a real GNOME session" job never
# started at all.
#
# The effect is backwards: the tier stops running exactly when the branch is
# being worked on, which is when it would find something. A tier that only
# completes on a quiet branch is a nightly tier with extra steps.
#
# NOT CHANGED HERE, because the fix is not free and the choice is not obvious:
#
#   cancel-in-progress: false  lets each push queue another twenty-minute
#                              three-VM run. On a busy branch that is a real
#                              bill, and the runs behind the newest one answer
#                              for commits nobody will look at again.
#   a longer debounce          would need a scheduler this does not have.
#   leave it                   and accept that the tier answers for whatever
#                              was pushed last before a pause.
#
# The third is what happens today, and it works if whoever is pushing knows to
# stop and let it finish. That is the part that was not written down, so it is
# written down now.
#
# UPDATE, since the trigger list above narrowed: this mostly stops mattering.
# The tier no longer runs on PRs that touch launcher code, so the "cancelled by
# the next push while the branch is being worked on" case needs someone to be
# actively iterating on the tier's own scripts — rare, and they are the person
# who knows to wait. Release runs are keyed on a tag ref, so two releases never
# cancel each other, and nothing else shares their concurrency group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The default for every job in this file. Jobs that need more say so
# themselves, and a job-level block REPLACES this one rather than adding to it —
# so an elevated job must restate `contents: read` if it also checks out code.
#
# The point is what happens to the NEXT job somebody adds here: without this it
# inherits the repository default, which may be write-all. With it, a new job
# has to ask.
permissions:
  contents: read

jobs:
  boot-bluefin:
    name: Stock Bluefin boots and paints
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'control'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vm-host

      # See packaging/vmtest/Containerfile.bluefin for why this indirection is
      # needed. Short version: corral `podman create`s the image to probe its
      # filesystem, and a bootc OS image has no CMD for podman to accept.
      - name: Add a CMD so podman will create a container from the image
        run: |
          sudo podman build \
            -t localhost/bluefin-testable:ci \
            -f packaging/vmtest/Containerfile.bluefin \
            packaging/vmtest
          sudo podman image inspect localhost/bluefin-testable:ci \
            --format 'Cmd={{.Config.Cmd}}  Size={{.Size}}'

      - name: Boot Bluefin
        env:
          # corral has no CORRAL_HOME: `qemu.VMHome()` is `os.UserHomeDir()` +
          # .local/share/corral/vms, and on Unix that reads $HOME. Overriding HOME
          # is therefore the actual lever for putting a 30 GB disk image somewhere
          # with room for it. `sudo -E` preserves it.
          HOME: /mnt/corral
          TMPDIR: /mnt/corral
        run: |
          mkdir -p /mnt/corral
          # The marker comes from a unit we install, not from systemd's own
          # output, and the two obvious alternatives are both wrong here.
          # graphical.target is never reached on this image: plymouth-quit-wait
          # starts and never finishes with no real display, and it gates the
          # target. 'Started .*gdm\.service' does fire — as GDM takes the DRM
          # device and blanks it, several seconds before the greeter draws — so
          # corral, which captures its final frame at readiness and does not
          # retry, sampled a blank screen and --require-paint failed at
          # deviation exactly 0.0000. See packaging/vmtest/wait-graphical.sh.
          sudo -E "$(which corral)" vmtest bluefin \
            --bootc localhost/bluefin-testable:ci \
            --ready-marker 'COMPASS-VMTEST: graphical session up' \
            --require-paint \
            --video \
            --cpu 4 --mem 8G --disk 30G \
            --timeout 30m \
            --artifacts "$GITHUB_WORKSPACE/vmtest-out" \
            --rm
        # Exit codes are per failure class (ADR-0010):
        #   2 this host cannot run it   6 guest never became ready
        #   4 the disk build failed     9 the guest painted nothing

      - name: What the run reported
        if: always()
        run: scripts/vmtest/report.sh vmtest-out

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vmtest-bluefin
          path: vmtest-out/
          retention-days: 14
          if-no-files-found: warn

  # One definition of how the Flatpak is built, called rather than copied. What
  # this job produces is the `flatpak-bundle` artifact the image build consumes.
  flatpak:
    name: Flatpak
    if: github.event_name != 'workflow_dispatch' || inputs.jobs != 'control'
    uses: ./.github/workflows/flatpak.yaml

  boot-compass:
    name: Compass runs in a real GNOME session
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'compass'
    needs: flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      # Into the build context, which is what Containerfile.compass COPYs from.
      - name: Fetch the Flatpak bundle
        uses: actions/download-artifact@v4
        with:
          name: flatpak-bundle
          path: packaging/vmtest

      - uses: ./.github/actions/vm-host

      - name: Build the test image
        run: |
          ls -lh packaging/vmtest/org.tunaos.compass.flatpak
          # The Containerfile COPYs the harvester, so it has to be in the
          # build context. Staged here rather than duplicated in the image:
          # scripts/harvest-desktop-corpus.sh is the one definition of a
          # harvest, and it is the copy tier 1 shellchecks.
          cp scripts/harvest-desktop-corpus.sh packaging/vmtest/
          # And the GNOME Shell extension, for the same reason: the image
          # installs the in-tree copy, the one the contract test checks.
          cp -r extensions/gnome-shell/compass@tunaos.org packaging/vmtest/
          sudo podman build \
            -t localhost/bluefin-compass:ci \
            -f packaging/vmtest/Containerfile.compass \
            packaging/vmtest
          sudo podman image inspect localhost/bluefin-compass:ci \
            --format 'Cmd={{.Config.Cmd}}  Size={{.Size}}'

      - name: Boot it and run the assertions
        env:
          HOME: /mnt/corral
          TMPDIR: /mnt/corral
          # Through the environment, never interpolated into the script.
          CHECKS: ${{ inputs.checks }}
        run: |
          mkdir -p /mnt/corral
          # Deliberately no --user: that would make corral derive an image
          # layer, and its layer builder pulls the base unconditionally, which
          # cannot work for a localhost/ reference (exit 3, "pinging container
          # registry localhost"). The compass account is created in the image
          # instead — see packaging/vmtest/Containerfile.compass — and root SSH
          # comes from `bootc install --root-ssh-authorized-keys` during the
          # disk build, with no layer involved. So this job, like the control,
          # tests the image exactly as built.
          #
          # Same marker as the control job, for the same reason, and here it
          # does double duty: it is satisfied by the autologin session rather
          # than a greeter, so by the time the checks run there is a real user
          # session to inspect. The checks still do their own waiting with
          # explicit timeouts, because a named check timing out is a better
          # failure message than a readiness timeout.
          # The checks: the dispatch's list, else the default set. Each name
          # must be a checks.sh subcommand; anything else is refused here,
          # before a VM is booted for it, and never reaches a shell unquoted.
          checks="${CHECKS:-installed session shell-extension doctor doctor-assert spike-b}"
          args=()
          for check in $checks; do
            if ! [[ "$check" =~ ^[a-z][a-z0-9-]*$ ]] \
              || ! grep -Eq "^  ${check}\)" packaging/vmtest/checks.sh; then
              echo "::error::'$check' is not a checks.sh subcommand"
              exit 1
            fi
            args+=(--check "/usr/libexec/compass-vmtest/checks.sh $check")
          done
          echo "checks: $checks"
          sudo -E "$(which corral)" vmtest compass \
            --bootc localhost/bluefin-compass:ci \
            --ready-marker 'COMPASS-VMTEST: graphical session up' \
            --require-paint \
            --video \
            "${args[@]}" \
            --cpu 4 --mem 8G --disk 30G \
            --timeout 30m \
            --artifacts "$GITHUB_WORKSPACE/vmtest-out" \
            --rm
        # Adds one exit code to the list above: 8, a check failed. That is the
        # one that means "the OS is fine and our software is not".

      - name: What the run reported
        if: always()
        run: scripts/vmtest/report.sh vmtest-out

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vmtest-compass
          path: vmtest-out/
          retention-days: 14
          if-no-files-found: warn

  # Spike A (#3, #18). Not a gate — an experiment whose output is knowledge.
  #
  # It is a separate job from boot-compass for one structural reason: the
  # keypress has to come from OUTSIDE the guest, and corral runs every --check
  # over its own SSH connection with no way to interleave a host command. So
  # this run leaves the VM up (no --rm), and scripts/vmtest/spike-a.sh drives
  # guest, host, guest afterwards.
  #
  # It runs on a PR under the same paths rule as the jobs above, and for the
  # same reason: a job introduced without ever running is a job discovered
  # broken at 3am. Once its question has an answer recorded in ADR-0010, this
  # can drop back to nightly.
  spike-a:
    name: "Spike A: does the portal give us Super+Space?"
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'spike-a'
    needs: flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the Flatpak bundle
        uses: actions/download-artifact@v4
        with:
          name: flatpak-bundle
          path: packaging/vmtest

      - uses: ./.github/actions/vm-host

      # The Containerfile's build context is packaging/vmtest, so anything it
      # COPYs has to be staged there first — the Flatpak bundle already is.
      # Copied rather than duplicated: scripts/harvest-desktop-corpus.sh is the
      # one definition of what a harvest is, and it is the copy tier 1
      # shellchecks.
      - name: Stage the corpus harvester and the Shell extension into the build context
        run: |
          cp scripts/harvest-desktop-corpus.sh packaging/vmtest/
          cp -r extensions/gnome-shell/compass@tunaos.org packaging/vmtest/

      - name: Build the test image
        run: |
          sudo podman build \
            -t localhost/bluefin-compass:ci \
            -f packaging/vmtest/Containerfile.compass \
            packaging/vmtest

      - name: Boot it, and leave it running
        env:
          HOME: /mnt/corral
          TMPDIR: /mnt/corral
        run: |
          mkdir -p /mnt/corral
          # No --rm and no --check: the VM has to outlive vmtest so a key can be
          # pressed at it from here.
          sudo -E "$(which corral)" vmtest spike-a \
            --bootc localhost/bluefin-compass:ci \
            --ready-marker 'COMPASS-VMTEST: graphical session up' \
            --require-paint \
            --cpu 4 --mem 8G --disk 30G \
            --timeout 30m \
            --artifacts "$GITHUB_WORKSPACE/vmtest-out"

      - name: Bind the shortcut, press the key, read the answer
        env:
          HOME: /mnt/corral
          TMPDIR: /mnt/corral
        # Teed to a file so the driver's own output survives report.sh's serial
        # dump and can be reprinted last. pipefail so the step's status is the
        # driver's and not tee's.
        #
        # The chown is not optional and its position is the point: corral runs
        # under sudo and creates vmtest-out as root, and the shell opens tee's
        # file BEFORE the driver runs — so the driver chowning the directory
        # itself, as it does, is too late. Without this the run works perfectly,
        # prints everything, and then fails on `tee: Permission denied`, which
        # is a spectacular way to lose an answer you already have.
        run: |
          set -o pipefail
          sudo chown -R "$(id -un)" vmtest-out
          scripts/vmtest/spike-a.sh vmtest-out spike-a 2>&1 \
            | tee vmtest-out/spike-a-driver.log

      - name: What the boot reported
        if: always()
        run: scripts/vmtest/report.sh vmtest-out

      # report.sh dumps an ANSI-expanded serial console, which is hundreds of
      # log lines and buries whatever came before it — the same burial that
      # already cost this tier three unreadable diagnostics. The answer this job
      # exists to produce therefore prints again, last.
      - name: Spike A, last so it survives the serial dump
        if: always()
        run: |
          echo '=============================================================='
          # `sed` on a file that exists but lacks the marker exits 0 and prints
          # nothing, so an `||` fallback stays silent — which is what happened:
          # two delimiters with nothing between them, and the actual failure
          # still buried. Test for the marker, and fall back to the whole file.
          if [ -f vmtest-out/spike-a.txt ] && grep -q '^--- report ---$' vmtest-out/spike-a.txt; then
            sed -n '/^--- report ---$/,$p' vmtest-out/spike-a.txt
            # And the driver's own trace, always. A report can be produced by a
            # run that still failed somewhere — that is exactly what happened —
            # and finding out where has cost this job several deep log reads.
            echo '--- and how the driver got there ---'
            cat vmtest-out/spike-a-driver.log 2>/dev/null || echo '(no driver log)'
          elif [ -f vmtest-out/spike-a-driver.log ]; then
            # No report, so the interesting thing is how the driver died. This
            # is here because four separate diagnoses of this job have had to
            # page hundreds of lines back past an ANSI-expanded serial console
            # to find one line of output.
            echo 'no report; the driver said:'
            cat vmtest-out/spike-a-driver.log
          else
            echo 'no report and no driver log — the step never ran'
          fi
          echo '=============================================================='

      # The runner is thrown away either way, but a 30 GB disk image left behind
      # can starve the artifact upload of space.
      - name: Delete the VM
        if: always()
        env:
          HOME: /mnt/corral
        run: sudo -E "$(which corral)" delete spike-a --force || true

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-a
          path: vmtest-out/
          retention-days: 14
          if-no-files-found: warn

  # The launcher, in a real GNOME session, on the target OS.
  #
  # Until #29 there was nothing to point this tier at: its checks answered "can
  # compass run here" — session type, session bus, portal, sandbox — and the
  # product itself had no window to open. This is the first job that exercises
  # the thing the project is for.
  #
  # Separate from boot-compass for the same structural reason as spike-a: the
  # only observer of the framebuffer is corral, on the host side of QEMU, and
  # corral runs every --check over its own SSH connection with no way to
  # interleave a host command. So this run leaves the VM up (no --rm) and
  # scripts/vmtest/launcher.sh drives guest, host, guest.
  #
  # It also gives the session something to draw, which matters beyond this job:
  # ADR-0010 records that --require-paint passes on the compass image at a
  # deviation of 0.0254 against corral's 0.02 blank threshold, because a GNOME
  # desktop under llvmpipe is mostly flat dark pixels. That margin is thin
  # enough to flap. A launcher on screen is the honest way to widen it — the
  # dishonest way, which ADR-0010 rules out, is to move the threshold.
  launcher:
    name: "The launcher opens in a real GNOME session"
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'launcher'
    needs: flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the Flatpak bundle
        uses: actions/download-artifact@v4
        with:
          name: flatpak-bundle
          path: packaging/vmtest

      - uses: ./.github/actions/vm-host

      # The Containerfile's build context is packaging/vmtest, so anything it
      # COPYs has to be staged there first — the Flatpak bundle already is.
      # Copied rather than duplicated: scripts/harvest-desktop-corpus.sh is the
      # one definition of what a harvest is, and it is the copy tier 1
      # shellchecks.
      - name: Stage the corpus harvester and the Shell extension into the build context
        run: |
          cp scripts/harvest-desktop-corpus.sh packaging/vmtest/
          cp -r extensions/gnome-shell/compass@tunaos.org packaging/vmtest/

      - name: Build the test image
        run: |
          sudo podman build \
            -t localhost/bluefin-compass:ci \
            -f packaging/vmtest/Containerfile.compass \
            packaging/vmtest

      - name: Boot it, and leave it running
        env:
          HOME: /mnt/corral
          TMPDIR: /mnt/corral
        run: |
          mkdir -p /mnt/corral
          # No --rm and no --check: the VM has to outlive vmtest so the host can
          # screenshot it and type at it.
          sudo -E "$(which corral)" vmtest launcher \
            --bootc localhost/bluefin-compass:ci \
            --ready-marker 'COMPASS-VMTEST: graphical session up' \
            --require-paint \
            --video \
            --cpu 4 --mem 8G --disk 30G \
            --timeout 30m \
            --artifacts "$GITHUB_WORKSPACE/vmtest-out"

      - name: Open the launcher, look at it, type at it
        env:
          HOME: /mnt/corral
          TMPDIR: /mnt/corral
        # The chown's position is the point, not a detail: corral runs under
        # sudo and creates vmtest-out as root, and the shell opens tee's file
        # BEFORE the driver runs — so the driver chowning the directory itself,
        # as it does, is too late. Without this the run works perfectly, prints
        # everything, and then fails on `tee: Permission denied`. That has
        # already cost this tier one green run.
        run: |
          set -o pipefail
          sudo chown -R "$(id -un)" vmtest-out
          scripts/vmtest/launcher.sh vmtest-out launcher 2>&1 \
            | tee vmtest-out/launcher-driver.log

      - name: What the boot reported
        if: always()
        run: scripts/vmtest/report.sh vmtest-out

      # report.sh dumps an ANSI-expanded serial console, hundreds of lines that
      # bury whatever came before. Everything this job exists to say therefore
      # prints again, last. Three separate diagnoses in this tier have had to
      # page back past that dump to find one line.
      - name: The launcher, last so it survives the serial dump
        if: always()
        run: |
          echo '=============================================================='
          if [ -f vmtest-out/launcher-driver.log ]; then
            cat vmtest-out/launcher-driver.log
          else
            echo 'no driver log — the step never ran'
          fi
          echo '=============================================================='

      # The runner is thrown away either way, but a 30 GB disk image left behind
      # can starve the artifact upload of space.
      - name: Delete the VM
        if: always()
        env:
          HOME: /mnt/corral
        run: sudo -E "$(which corral)" delete launcher --force || true

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher
          path: vmtest-out/
          retention-days: 14
          if-no-files-found: warn
