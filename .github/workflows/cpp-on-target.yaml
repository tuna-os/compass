name: C++ on the target

# Phase 1's gate is Suite 0 parity, and Suite 0 is a *differential* harness:
# §8.1 says "for each item, run the operation against both engines and diff
# structured output". crates/compass-testkit/src/parity.rs exists and takes a
# --cpp-engine path. It has never run, because there is no C++ engine on the
# target to point it at.
#
# So the gate needs three things: the corpus (115 of ~500), the runner (exists,
# dormant) and a C++ build on Bluefin (this). That last one is the keystone —
# the corpus can grow forever and Suite 0 still cannot run without it.
#
# THIS JOB IS THE CHEAP HALF, DELIBERATELY. It installs the dependencies and
# runs `cmake` configure, which exercises every find_package(Qt6 COMPONENTS …)
# in the tree, and stops before compiling 144k lines of C++23. Configure is
# about a minute; the full build is twenty-plus. The riskiest unknown here is
# whether Fedora's package names cover what Arch's do, and configure answers
# that for a twentieth of the cost.
#
# PLAN.md §12 item 3 costs the rest: build inside this same image rather than a
# fedora:44 container, because src/server/CMakeLists.txt links Qt6::GuiPrivate
# and a binary bound to private headers must be built against the exact Qt the
# VM boots.

# Linux first, and for now Linux only.
#
# ADR-0013 makes Linux-first a sequence rather than a scope limit: macOS and
# Windows get their own phases (9 and 10), and until then every non-Linux build
# on every pull request is work nobody reads. The Flatpak is what ships on
# Bluefin, so it is the one that stays.
#
# THE ABOVE STOPPED DESCRIBING THIS FILE, AND TOOK C++ PR COVERAGE WITH IT.
#
# That reasoning disabled the whole `pull_request` trigger, and the two jobs
# left here are `configure` and `build` — both `ubuntu-24.04`, both against
# Bluefin's Qt. There is no non-Linux build in this file to save. So the effect
# was not "stop building macOS on PRs", it was **nothing compiles C++ on a pull
# request at all**: of the seven workflows with a `pull_request` trigger, the
# Flatpak packages the Rust engine and `format.yaml` only runs `clang-format`
# over `src/`. A change to 144k lines of C++23 was found out about at 02:00 UTC,
# or not at all.
#
# That matters now rather than in the abstract: §8.1a rung 2 — the ranked-output
# path the Suite 0 differential needs (#12) — is an IPC method, a server handler
# and a CLI command, all in this tree. Writing it against a build nothing runs
# on the PR is a speculative push by construction.
#
# So `configure` comes back for pull requests, and `build` does not. Configure
# is about a minute and exercises every `find_package(Qt6 COMPONENTS …)` and the
# whole CMake graph, which is what catches a new source file missing from a
# target or a regenerated protocol that breaks the wiring. `build` is twenty
# minutes plus and stays on the nightly schedule and the Actions tab, where it
# has always been.
on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'figura/**'
      - 'scripts/runners/**'
      - '.github/workflows/cpp-on-target.yaml'
      # THE RUST HALF OF THE DIFFERENTIAL.
      #
      # The Suite 0 gate exists to catch a change in how this engine ranks,
      # and until now it could not fire on one: the paths above are all C++,
      # so a Rust ranking change never started this workflow and the gate ran
      # only when someone dispatched it by hand. A gate that cannot trigger on
      # the change it guards is not a gate.
      #
      # Narrow on purpose -- this costs ~12 minutes, so it is the code that
      # decides a ranking and nothing else. A clipboard or portal change does
      # not need the C++ engine built to answer for it.
      - 'crates/compass-search/**'
      - 'crates/compass-core/src/apps.rs'
      - 'crates/compass-core/src/root_items.rs'
      - 'crates/vicinae/src/serve.rs'
      - 'crates/compass-testkit/**'
  workflow_dispatch:

  # Nightly, so the artifact this job publishes actually exists when something
  # needs it.
  #
  # WHY THIS WAS ADDED
  #
  # This job's own closing step says what it is for: `vicinae-cpp-bluefin.tar.gz`
  # is "the second engine Suite 0 has been missing" — `compass-testkit`'s
  # `parity` binary takes `--cpp` and has never run because there was nothing
  # to point it at. #117's head-to-head bench needs the same artifact.
  #
  # On `workflow_dispatch` alone that artifact only exists when somebody
  # remembers to press a button, and it expires after 7 days. So both #12's
  # remaining parity work and #117 were blocked on a build that already worked,
  # for want of a trigger. Nightly keeps a fresh tarball available without
  # putting a full Qt build on anyone's pull request.
  #
  # 02:00 rather than the VM tier's 03:00: that tier is the consumer, so the
  # producer runs first. Not a dependency — GitHub does not order scheduled
  # workflows — but an hour is ample for this build, and having them collide is
  # avoidable for free.
  schedule:
    - cron: "0 2 * * *"

  # Releases, matching the VM tier. If a tagged build is what users install,
  # the C++ engine it is compared against should be built from the same tag.
  push:
    tags:
      - "v*"

# The event is part of the key, and that is not cosmetic.
#
# Without it, a `workflow_dispatch` run and a `pull_request` run on the same
# branch share a group and cancel each other. They are not interchangeable:
# the pull_request run skips `build` (see its `if:` below), so a push silently
# killed the only run that compiles anything. That happened TWICE while
# validating the rung-2 handler — a dispatched build, a push, and a result
# that never existed to read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  configure:
    name: The C++ engine configures against Bluefin's Qt
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Pull the target image
        run: |
          # The same image the VM tier boots, so what configures here is what
          # would build there.
          podman pull ghcr.io/ublue-os/bluefin:stable
          podman run --rm ghcr.io/ublue-os/bluefin:stable \
            sh -c 'cat /etc/os-release | grep -E "^(NAME|VERSION)="'

      - name: What Qt does the target actually have?
        run: |
          # Printed before the install, because "which Qt" is a fact worth
          # having in the log even when the install below fails.
          podman run --rm ghcr.io/ublue-os/bluefin:stable \
            sh -c 'dnf -q list --available "qt6-qtbase*" 2>/dev/null | head -20' \
            || echo '(listing failed; the install step will say why)'

      - name: Install the build dependencies and configure
        run: |
          set -o pipefail
          # The dependency list lives in scripts/runners/bluefin/install-deps.sh,
          # next to the Arch one and for the same reason: the build job below
          # needs the identical set, and a list duplicated between two jobs is a
          # list that drifts. That script also carries the reasoning for each
          # translation from Arch's names, including the two corrections four
          # red runs paid for.
          podman run --rm -v "$PWD:/src:z" -w /src \
            ghcr.io/ublue-os/bluefin:stable bash -euxo pipefail -c '
              ./scripts/runners/bluefin/install-deps.sh

              # Catches what configure structurally cannot: dependencies this
              # tree links by bare name or includes with no find_package behind
              # them. A missing libxkbcommon-devel configures perfectly and
              # then fails at object 624 of 812.
              ./scripts/runners/bluefin/verify-deps.sh

              echo "--- what Qt did we get? ---"
              qmake6 -query QT_VERSION || rpm -q qt6-qtbase

              echo "--- configure ---"
              cmake -S . -B /tmp/build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_TESTS=OFF \
                -DUSE_SYSTEM_CMARK_GFM=OFF \
                -DUSE_SYSTEM_QT_KEYCHAIN=OFF
            '

      - name: What this proves, and what it does not
        if: always()
        run: |
          echo 'Configure exercises every find_package(Qt6 COMPONENTS ...) in the'
          echo 'tree against the Qt the target actually ships. It does NOT prove'
          echo 'the code compiles or links there — that is PLAN.md §12 item 3, and'
          echo 'it is the expensive half. This job exists so the expensive half'
          echo 'starts from a known-good dependency set instead of discovering a'
          echo 'missing package twenty minutes in.'

  build:
    name: The C++ engine builds on Bluefin
    needs: configure
    # ON PULL REQUESTS NOW, because the `parity` gate below needs the engine
    # this job publishes. It was dispatch-and-nightly only, back when nothing
    # on a PR consumed the artifact; that made the Suite 0 gate unable to fire
    # on the very changes it guards.
    #
    # The cost is bounded by the trigger's paths rather than by skipping the
    # job: ~4 minutes with a warm ccache, only on changes that touch the C++
    # tree or the Rust code that decides a ranking.
    #
    # `parity-spike` stays dispatch-only — it is a diagnostic for a question
    # already answered, not a check.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # ccache lives on the host and is mounted into the build container, so
      # the cache key is the runner's business rather than podman's. Without it
      # every run recompiles 144k lines from scratch; with it a rerun that only
      # changed the workflow is minutes.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: cpp-bluefin-ccache-${{ github.sha }}
          restore-keys: |
            cpp-bluefin-ccache-

      - name: Build, and stage an installable tree
        run: |
          set -o pipefail
          mkdir -p ~/.cache/ccache
          # /root IS NOT A USABLE HOME DIRECTORY IN THIS IMAGE, and two
          # separate things in this job tripped over that before the rule was
          # written down here.
          #
          # First crun, on the ccache mount:
          #
          #   creating `/root/.cache/ccache`: openat2 `root`: No such file or
          #   directory
          #
          # Then, once the mount moved to /ccache, npm six minutes into the
          # build:
          #
          #   ENOTDIR: not a directory, mkdir '/root'
          #
          # The first fix treated one consumer rather than the cause, which is
          # why the second cost a full build cycle. So: nothing here writes to
          # the default HOME. It is set to a real directory below, and the
          # container prints what /root actually is so the log carries the fact
          # rather than my inference about bootc's /var/roothome symlink.
          # Same image and same dependency list as the configure job above,
          # via the same script, so the two cannot drift apart. The expensive
          # half is deliberately gated on `needs: configure`: if a package name
          # is wrong, that job says so in a minute rather than this one saying
          # so in twenty.
          podman run --rm \
            -v "$PWD:/src:z" -v "$HOME/.cache/ccache:/ccache:z" \
            -e CCACHE_DIR=/ccache -e CCACHE_MAXSIZE=2G \
            -e HOME=/tmp/home \
            -w /src \
            ghcr.io/ublue-os/bluefin:stable bash -euxo pipefail -c '
              ./scripts/runners/bluefin/install-deps.sh
              dnf install -y --setopt=install_weak_deps=False ccache
              ./scripts/runners/bluefin/verify-deps.sh

              # What /root actually is, recorded rather than assumed. Both
              # failures above are explained by it; the log should say so.
              ls -ld /root || true
              readlink -f /root || true

              # HOME must exist and be writable before anything that uses it —
              # npm, which the build invokes for the TypeScript API client, is
              # the consumer that found this the hard way at step 113 of 812.
              mkdir -p "$HOME"
              test -d "$HOME" && test -w "$HOME"

              # Checked before the build rather than after it. ccache degrades
              # silently when its directory is unwritable — every compile is a
              # miss and the job simply takes twenty minutes every time — so a
              # broken mount would otherwise look like success.
              test -w "$CCACHE_DIR"
              ccache --zero-stats

              # And prove npm can actually run under that HOME, in a second,
              # rather than discovering it six minutes into a compile.
              npm --version
              npm config get cache

              cmake -S . -B /tmp/build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_TESTS=OFF \
                -DUSE_SYSTEM_CMARK_GFM=OFF \
                -DUSE_SYSTEM_QT_KEYCHAIN=OFF \
                -DCMAKE_INSTALL_PREFIX=/usr \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

              cmake --build /tmp/build --parallel "$(nproc)"

              # DESTDIR staging rather than installing into the container: the
              # container is thrown away, and what the VM tier needs is a tree
              # it can unpack over / in the test image. Staged under /tmp
              # rather than the bind mount, to keep the install tree out of the
              # checkout — though the build writes into it regardless, since
              # Figura generates the TypeScript client in-tree and npm puts
              # node_modules next to it.
              DESTDIR=/tmp/stage cmake --install /tmp/build

              echo "--- what got staged ---"
              find /tmp/stage -type f | sort

              # The two files Suite 0 actually needs, asserted rather than
              # assumed: `cmake --install` succeeding says nothing about which
              # targets carried an install() rule, and src/cli is the engine
              # entrypoint `parity --cpp-engine` will invoke.
              test -x /tmp/stage/usr/bin/vicinae
              test -x /tmp/stage/usr/libexec/vicinae/vicinae-server

              tar -C /tmp/stage -czf /src/vicinae-bluefin.tar.gz .
              ccache --show-stats || true
            '
          # podman ran as root, so the staged files are root-owned and the
          # runner user cannot read them to upload.
          sudo chown "$(id -un)" vicinae-bluefin.tar.gz
          ls -lh vicinae-bluefin.tar.gz

      - name: Publish the C++ engine for the VM tier
        uses: actions/upload-artifact@v4
        with:
          name: vicinae-cpp-bluefin
          path: vicinae-bluefin.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: What this unblocks
        if: always()
        run: |
          echo 'This tarball is the second engine Suite 0 has been missing.'
          echo 'PLAN.md §8.1 diffs `vicinae --engine=cpp --json` against the Rust'
          echo 'engine; crates/compass-testkit/src/parity.rs takes --cpp-engine'
          echo 'and has never run because there was nothing to point it at.'
          echo
          echo 'Layering it into the VM image and running parity there is the'
          echo 'next step, and it is a separate change.'

  # CAN THE C++ ENGINE ANSWER A QUERY WITHOUT A USER SITTING IN FRONT OF IT?
  #
  # This is a spike, and it is a separate job from the parity run it is meant
  # to unblock, because the parity run cannot be designed until this is
  # answered.
  #
  # Rung 2 gave the C++ engine `vicinae query --json` and the Bluefin build
  # compiles it. What nothing has established is whether the engine it talks to
  # will START here. `vicinae server` execs a Qt application, and Tier 2 spent
  # four spikes learning what a container does and does not give a desktop
  # stack — GNOME Shell needs systemd-logind and dies in its JS UI layer;
  # Flatpak needs --privileged for `mount --make-rslave`. A Qt engine may need
  # a compositor, may need a session bus, or may need neither.
  #
  # So this asks exactly that, smallest question first, and records the answer
  # either way.
  #
  # THE EXIT CONTRACT, which the first run got wrong.
  #
  # It was `continue-on-error: true` and exited 1 on "no rung answered". That
  # conflates two different things and GitHub reports both as a red X anyway --
  # continue-on-error does not change a check run's conclusion, so the first
  # NO paged as a CI failure on a PR whose code was fine.
  #
  # A spike that ANSWERS has succeeded, whatever the answer. So:
  #
  #   exit 0  the question was asked and answered, yes or no
  #   exit 1  the question could not be asked -- the tarball is wrong, or the
  #           engine cannot even load, which the ldd check below catches
  #
  # The verdict is written to the step summary either way, so a NO is loud
  # without being red.
  #
  # Three rungs, in order, so a failure says WHICH thing is missing:
  #
  #   1. bare              — no bus, no display
  #   2. + dbus-run-session — a session bus
  #   3. + mutter           — a wayland compositor, via the Tier 2 harness
  #
  # Whichever is the first to answer `ping` is what the parity run will need,
  # and that is the design decision this job exists to make.
  parity-spike:
    name: "Suite 0 spike: does the C++ engine serve headless?"
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Fetch the engine this workflow just built
        uses: actions/download-artifact@v4
        with:
          name: vicinae-cpp-bluefin

      - name: Ask, one rung at a time
        run: |
          set -o pipefail
          # BOUNDED AT THE CONTAINER, not just inside it.
          #
          # The query has its own 30s budget, but that only covers the one
          # place I predicted could block. A run that hangs anywhere else --
          # and the likeliest candidate is a backgrounded engine surviving
          # `kill` and holding the stdout pipe open, so `podman run` never
          # returns -- would otherwise sit until the 30-minute job timeout and
          # report as "the job timed out".
          #
          # That is the same shape as the Flatpak wrapper-PID problem
          # prove-smoke.sh was written to catch: killing the thing you spawned
          # is not the same as killing the thing that is running.
          #
          # 8 minutes is generous against the ~2 this takes when it works, and
          # turns any hang into a named one within a readable budget.
          timeout --signal=KILL 480 podman run --rm \
            -v "$PWD:/src:z" \
            -e HOME=/tmp/home \
            -e XDG_DATA_DIRS=/corpus \
            -v "$PWD/crates/compass-testkit/corpus/desktop-entries/real:/corpus/applications:ro,z" \
            -w /src \
            --shm-size=2g \
            ghcr.io/ublue-os/bluefin:stable bash -euo pipefail -c '
              mkdir -p "$HOME"

              # THE FIRST RUN OF THIS SPIKE DIED HERE, AND THAT WAS THE POINT.
              #
              #   vicinae-server: error while loading shared libraries:
              #   libKF6SyntaxHighlighting.so.6: cannot open shared object file
              #
              # Not a display, not a bus -- the engine never loaded. The build
              # job installs its dependencies into ITS container; this is a
              # fresh image with a tarball unpacked over it, and a staged tree
              # is not a package with requires. So the runtime deps go in here
              # too, from the same script the build uses, which is also what a
              # user gets when they install the real package.
              ./scripts/runners/bluefin/install-deps.sh

              tar -C / -xzf /src/vicinae-bluefin.tar.gz

              # Existing is not running, and the first run proved the
              # difference: both these asserts passed and `vicinae version`
              # printed, while vicinae-server could not resolve a library. The
              # CLI links against far less than the engine does.
              test -x /usr/bin/vicinae
              test -x /usr/libexec/vicinae/vicinae-server
              echo "--- version ---"
              vicinae version || echo "(version failed)"

              # So check the engine can LOAD before asking it to serve. ldd
              # names every unresolved library at once; a start-and-poll finds
              # them one restart at a time.
              echo "--- unresolved libraries, if any ---"
              if ldd /usr/libexec/vicinae/vicinae-server | grep -F "not found"; then
                echo "the engine cannot load; the rungs below would all report the same thing"
                exit 1
              fi
              echo "(none)"

              # Its own runtime dir, because that is how Suite 0 isolates this
              # engine: vicinae::serverSocketName() is runtimeDir()/vicinae.sock
              # and runtimeDir() reads XDG_RUNTIME_DIR. No --socket flag exists
              # on this side and none is needed.
              export XDG_RUNTIME_DIR=/tmp/rt
              mkdir -p "$XDG_RUNTIME_DIR"
              chmod 700 "$XDG_RUNTIME_DIR"

              # Readiness is a state, not a moment (ADR-0010): poll ping rather
              # than sleeping a plausible number of seconds.
              try_rung() {
                local label="$1"; shift
                echo "=== rung: $label ==="
                rm -rf "$XDG_RUNTIME_DIR"/*
                "$@" vicinae server >"/src/spike-$label.log" 2>&1 &
                local pid=$!
                local i
                for i in $(seq 1 60); do
                  if vicinae ping >/dev/null 2>&1; then
                    echo "ANSWERED after ${i}00ms: $label"

                    # A QUERY IS NOT ANSWERED UNTIL IT RANKS SOMETHING,
                    # AND WITH THE CORPUS MOUNTED IT STILL RANKS NOTHING.
                    #
                    # Measured: 738 entries visible, engine answering `ping`
                    # in 600ms, `query --json chromium` returning `[]`
                    # immediately -- not a timeout, the 30s budget below was
                    # not spent. So the empty ranking is NOT about an empty
                    # container, which was the obvious explanation and is now
                    # ruled out.
                    #
                    # What it could still be, in rough order of likelihood:
                    #
                    #   * the app provider indexes asynchronously and has not
                    #     finished 600ms after the socket answers -- `ping` is
                    #     a liveness check, not a readiness-to-rank one;
                    #   * XDG_DATA_DIRS is not how this engine finds apps, in
                    #     which case the corpus needs mounting where its own
                    #     scan roots look;
                    #   * rootQuery without `--provider` ranks root items and
                    #     the apps provider is not among them here.
                    #
                    # The parity run cannot be written until this is settled:
                    # a differential over two empty rankings agrees perfectly
                    # and proves nothing, which is the exact shape of green
                    # this repository keeps catching.
                    #
                    # The first YES returned `[]`, and an empty array is what a
                    # BROKEN query path returns too. The container ships no
                    # applications, so there was nothing to rank and nothing to
                    # tell the two apart. XDG_DATA_DIRS now points at the
                    # 757-entry corpus this repo already harvested, which is
                    # the same corpus Suite 0 diffs against.
                    echo "--- indexable entries visible to the engine ---"
                    ls /corpus/applications | wc -l

                    # THE QUERY TERM MUST EXIST IN THE CORPUS.
                    #
                    # Every run so far asked for `firefox`. There is no
                    # Firefox entry in this corpus -- it is a harvest of
                    # 738 host entries and Firefox is not among them. So
                    # `[]` may have been the CORRECT answer all along, and
                    # the spike could not tell that from a broken query
                    # path. Same defect as the probe above, one layer out:
                    # an empty result meaning two different things.
                    #
                    # `chromium` is present as `Chromium Web Browser`, with
                    # no NoDisplay, no Hidden and no OnlyShowIn, so
                    # DesktopEntry::shouldBeShownInCurrentContext() keeps it
                    # even with XDG_CURRENT_DESKTOP unset in this container.
                    #
                    # Checked here rather than assumed, because the corpus
                    # can be re-harvested and this is the assumption that
                    # makes every number below readable.
                    echo "--- does the corpus contain what we are about to ask for? ---"
                    matches=$(grep -lix "Name=Chromium Web Browser" /corpus/applications/*.desktop | wc -l)
                    echo "entries named exactly \"Chromium Web Browser\": $matches"
                    if [ "$matches" -eq 0 ]; then
                      echo "::error::the corpus has no entry for the query term -- an empty ranking would prove nothing"
                      exit 1
                    fi
                    # BOUNDED, because the first corpus run hung here.
                    #
                    # The rung answered `ping`, then the query did not return.
                    # Unbounded, that burns the 30-minute job timeout and
                    # reports as "the job timed out" -- which is a different
                    # and much less useful finding than "the query hangs".
                    # A spike must bound its own wait.
                    # READINESS IS A STATE, AND `ping` IS THE WRONG STATE.
                    #
                    # ADR-0010 says poll the condition, not the clock, and the
                    # loop above does -- for LIVENESS. Ranking needs a
                    # different condition. `AppService` debounces its rescan
                    # by 500ms (app-service.cpp:178) and the engine answered
                    # `ping` at 600ms, so a query issued the instant the
                    # socket opens can race an index that is not built yet.
                    #
                    # So poll the query itself. A non-empty ranking is the
                    # readiness signal a parity run actually needs, and the
                    # time it took is the number worth knowing.
                    echo "--- polling the query until it ranks something (30s) ---"
                    ranked=""
                    for attempt in $(seq 1 60); do
                      if timeout 5 vicinae query --json chromium > /src/spike-query.json 2>&1 \
                         && [ -s /src/spike-query.json ] \
                         && ! grep -qx "\[\]" /src/spike-query.json; then
                        echo "RANKED after $((attempt * 500))ms"
                        ranked="yes"
                        break
                      fi
                      sleep 0.5
                    done

                    if [ -z "$ranked" ]; then
                      echo "STILL EMPTY after 30s with $(ls /corpus/applications | wc -l) entries visible."
                      echo "Not a timing race, then -- the engine answers and ranks nothing."
                      echo "Next suspect: rootQuery without --provider does not reach"
                      echo "the apps provider in this container."
                    fi
                    cat /src/spike-query.json

                    # DOES THE ENGINE HAVE ANY ROOT ITEMS AT ALL?
                    #
                    # `cmd ls --json` goes through listCommands, which calls
                    # RootItemManager::allItems() -- the same collection
                    # rootQuery ranks over, without the search. If this is
                    # empty too, the providers never loaded and the question
                    # is registration, not ranking. If it has entries and the
                    # query does not, the filter is the culprit.
                    #
                    # `ls` lives under `cmd` (CommandCommand, cli.cpp:262-272),
                    # NOT under `app` and NOT at the top level. Two runs got
                    # this wrong -- `app ls --json` ("arguments were not
                    # expected") and then `ls --json` ("a subcommand is
                    # required") -- and the JSON guard below is the only
                    # reason neither was read as an empty index.
                    echo "--- root items the engine knows about ---"
                    timeout 15 vicinae cmd ls --json > /src/spike-items.json 2>&1 || true
                    if head -c 1 /src/spike-items.json | grep -q '[[{]'; then
                      echo "items: $(grep -c '\"id\"' /src/spike-items.json)"
                      head -c 600 /src/spike-items.json
                    else
                      echo "PROBE DID NOT RUN -- this is not an empty index:"
                      head -c 400 /src/spike-items.json
                    fi
                    echo

                    echo "--- and once more, bounded, for the record ---"
                    if timeout 30 vicinae query --json chromium > /src/spike-query.json 2>&1; then
                      cat /src/spike-query.json
                    else
                      status=$?
                      if [ "$status" -eq 124 ]; then
                        echo "QUERY HUNG: no answer within 30s with $(ls /corpus/applications | wc -l) entries visible"
                      else
                        echo "(query failed, exit $status)"
                      fi
                      cat /src/spike-query.json || true
                    fi
                    # THE VERDICT KEYED OFF `ping`, AND PRINTED YES OVER AN
                    # EMPTY RANKING. That is the exact failure this job exists
                    # to catch, written by me into the job that catches it.
                    #
                    # Serving and ranking are different answers and the
                    # verdict now says which it got.
                    {
                      if [ -n "$ranked" ]; then
                        echo "### Suite 0 spike: YES, on the \`$label\` rung"
                        echo
                        echo "Serves AND ranks. The parity run needs this much and no compositor."
                      else
                        echo "### Suite 0 spike: PARTIAL, on the \`$label\` rung"
                        echo
                        echo "The engine SERVES here -- \`ping\` answered -- but ranks"
                        echo "nothing, for 30s, with $(ls /corpus/applications | wc -l) entries visible."
                        echo "Not a timing race. A parity run built on this would diff two"
                        echo "empty rankings, agree perfectly, and prove nothing."
                      fi
                      echo
                      echo "Hits for \`chromium\` over the checked-in corpus:"
                      echo '```json'
                      head -c 400 /src/spike-query.json
                      echo
                      echo '```'
                      echo
                      echo "Root items the engine knows about at all:"
                      echo '```'
                      head -c 400 /src/spike-items.json
                      echo
                      echo '```'
                    } > /src/spike-verdict.md
                    kill "$pid" 2>/dev/null || true
                    return 0
                  fi
                  kill -0 "$pid" 2>/dev/null || { echo "engine exited"; break; }
                  sleep 0.1
                done
                echo "NO ANSWER: $label"
                echo "--- its log ---"
                tail -40 "/src/spike-$label.log" || true
                kill "$pid" 2>/dev/null || true
                return 1
              }

              # Nothing backgrounded may outlive this script. A rung that
              # answered leaves an engine running, and an engine holding the
              # stdout pipe keeps `podman run` alive after bash has exited.
              # `kill "$pid"` alone did not prove sufficient, so the trap
              # sweeps by name as well.
              cleanup() {
                pkill -KILL -f vicinae-server 2>/dev/null || true
                pkill -KILL -f "vicinae server" 2>/dev/null || true
              }
              trap cleanup EXIT

              if try_rung bare env; then exit 0; fi

              # The bare rung named its own next step, which is why the rungs
              # are ordered cheapest-first rather than guessed:
              #
              #   FATAL - no Qt platform plugin could be initialized
              #   Available platform plugins are: ... offscreen, minimal, ...
              #
              # It wanted a DISPLAY, not a bus -- and it lists `offscreen`
              # itself. A compositor was the expected answer and would have
              # been the expensive one; this is an environment variable.
              if try_rung offscreen env QT_QPA_PLATFORM=offscreen; then exit 0; fi

              if command -v dbus-run-session >/dev/null 2>&1; then
                if try_rung dbus dbus-run-session --; then exit 0; fi
                if try_rung dbus-offscreen \
                     dbus-run-session -- env QT_QPA_PLATFORM=offscreen; then
                  exit 0
                fi
              else
                echo "dbus-run-session not in this image"
              fi

              # Only if all of the above failed is a compositor worth the
              # trouble, and mutter is confirmed present for that rung.
              if command -v mutter >/dev/null 2>&1; then
                echo "mutter is present; a compositor rung is possible if offscreen is not enough"
              else
                echo "mutter is NOT in this image; a compositor rung needs it installed"
              fi

              echo
              echo "FINDING: the engine did not answer on any rung tried here."
              echo "It loads (ldd is clean above) but does not serve, not even"
              echo "with QT_QPA_PLATFORM=offscreen. The next rung is a real"
              echo "compositor -- mutter, via the Tier 2 harness."
              {
                echo "### Suite 0 spike: NO"
                echo
                echo "The engine loads but answered \`ping\` on no rung, offscreen"
                echo "included. Next rung: a real compositor."
              } > /src/spike-verdict.md
            '

      # The verdict, where a reader will see it. The container cannot write to
      # $GITHUB_STEP_SUMMARY, so it leaves the file on the bind mount and this
      # step publishes it. Asserted rather than best-effort: a spike that
      # produced no verdict did not answer its question, and that IS a failure
      # of the job even though a NO is not.
      - name: The verdict
        if: always()
        run: |
          test -f spike-verdict.md || {
            echo "::error::the spike left no verdict — it did not reach an answer"
            exit 1
          }
          cat spike-verdict.md | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the engine logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-spike-logs
          # On the bind mount, not the container's /tmp. The first run
          # uploaded nothing -- "No files were found with the provided path"
          # -- because the logs never left the container.
          path: spike-*.log
          if-no-files-found: ignore
          retention-days: 7

  # THE REAL DIFFERENTIAL: both engines, one container, one corpus.
  #
  # Everything before this job established that it is possible. The spike
  # proved the C++ engine serves AND ranks on the `offscreen` rung with no
  # compositor and no session bus; `suite0-selftest` in `rust.yaml` proved the
  # harness completes a run end to end. This is the two of them together,
  # which is what §8.1 has been asking for since Phase 1 opened.
  parity:
    name: "Suite 0: the two engines, side by side"
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Fetch the C++ engine this workflow just built
        uses: actions/download-artifact@v4
        with:
          name: vicinae-cpp-bluefin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: suite0-parity-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: suite0-parity-${{ runner.os }}-

      # Built on the runner rather than in the container: the Bluefin image
      # ships no Rust toolchain, and a glibc built against 2.39 runs on the
      # container's newer one. The reverse would not, which is why the C++
      # engine is built IN the container and this is not.
      #
      # The `ldd` guard below is what turns that reasoning into a check.
      # `iced_layershell` (the wlroots launcher surface) builds
      # smithay-client-toolkit with xkbcommon, found through pkg-config.
      - name: Install the xkbcommon headers
        run: sudo apt-get update -q && sudo apt-get install -y -q libxkbcommon-dev

      - name: Build the Rust engine and the harness
        run: cargo build --locked --release -p vicinae -p compass-testkit --bin vicinae --bin parity

      - name: Both engines, one corpus
        run: |
          set -o pipefail
          timeout --signal=KILL 2100 podman run --rm \
            -v "$PWD:/src:z" \
            -w /src \
            --shm-size=2g \
            ghcr.io/ublue-os/bluefin:stable bash -euo pipefail -c '
              ./scripts/runners/bluefin/install-deps.sh >/dev/null 2>&1
              tar -C / -xzf /src/vicinae-bluefin.tar.gz

              # A binary that cannot load is not a parity finding. Both sides
              # are checked, because the Rust one crossed a distribution
              # boundary to get here and the C++ one needs its Qt runtime.
              for engine in /usr/bin/vicinae /src/target/release/vicinae; do
                echo "--- $engine ---"
                "$engine" --version 2>&1 | head -2 || "$engine" version 2>&1 | head -2 || true
                if ldd "$engine" 2>&1 | grep "not found"; then
                  echo "::error::$engine has unresolved libraries in this container"
                  exit 1
                fi
              done

              # --report-only, per ADR-0010: the first differential between two
              # independently written engines will disagree somewhere and
              # nobody knows where yet. Record the list, then gate on it once
              # it is known. The harness still FAILS if it cannot run, if an
              # engine will not start, or if nothing ranked.
              # --report-only covers the WHOLE-RANKING diff, which stays
              # informational: SUITE0-BASELINE.md measures 25% agreement at
              # two characters and 99.5% at ten, and gating the short end
              # would redden this job over tail order that is near-arbitrary
              # on both sides.
              #
              # --gate-top-result 4 is the half that DOES gate, and its
              # threshold comes from those measurements rather than from
              # taste: 906 comparable queries, 0 disagreements once the one
              # declared divergence (`Type=Directory`, PARITY.md compass-xdg
              # 5) is accounted for. It fails the job if a query of four or
              # more characters disagrees on the row a person launches, and
              # it also fails if it compared nothing.
              /src/target/release/parity \
                --report-only \
                --gate-top-result 4 \
                --cpp-provider applications \
                --cpp /usr/bin/vicinae \
                --rust /src/target/release/vicinae \
                --corpus /src/crates/compass-testkit/corpus/desktop-entries \
                --output /src/parity-out 2>&1 | tee /src/parity-run.log
            '
          sudo chown -R "$(id -un)" parity-out parity-run.log 2>/dev/null || true

      - name: What the two engines agreed and disagreed on
        if: always()
        run: |
          {
            echo "### Suite 0: the two engines, side by side"
            echo
            if [ -f parity-run.log ]; then
              echo '```'
              sed -n '/^Results:/,/^$/p' parity-run.log
              echo '```'
            else
              echo 'The run produced no log, so it did not reach a comparison.'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The per-query diff, which is the input to setting the gate. Kept long
      # because the series is the point: a divergence that appears once is
      # noise, one that persists is a bug in one of the two engines.
      - name: Keep the per-query report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            parity-out/parity-report.json
            parity-run.log
          if-no-files-found: warn
          retention-days: 90
