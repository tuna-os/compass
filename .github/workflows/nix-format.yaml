name: nix format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The default for every job in this file. Jobs that need more say so
# themselves, and a job-level block REPLACES this one rather than adding to it —
# so an elevated job must restate `contents: read` if it also checks out code.
#
# The point is what happens to the NEXT job somebody adds here: without this it
# inherits the repository default, which may be write-all. With it, a new job
# has to ask.
permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check Nix code formatting
        run: nix run nixpkgs#alejandra -- --check .
