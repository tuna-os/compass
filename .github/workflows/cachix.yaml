name: "Nix build"
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The default for every job in this file. Jobs that need more say so
# themselves, and a job-level block REPLACES this one rather than adding to it —
# so an elevated job must restate `contents: read` if it also checks out code.
#
# The point is what happens to the NEXT job somebody adds here: without this it
# inherits the repository default, which may be write-all. With it, a new job
# has to ask.
permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26]
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v31
    - name: Cache Nix Evaluation
      uses: actions/cache@v4
      with:
        path: ~/.cache/nix
        key: nix-eval-${{ hashFiles('flake.lock') }}
    - uses: cachix/cachix-action@v14
      with:
        name: vicinae
        authToken: ${{ github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
        pushFilter: "(swift-bin|swift-.*-RELEASE.*\\.tar\\.gz)"
    - name: Build Flake
      run: nix build -L
    - name: Build Rust engine
      run: nix build -L .#rust-vicinae
    - name: Build Soulver backend
      if: matrix.os == 'ubuntu-24.04'
      run: nix build -L .#with-soulver
    - name: Run Test Shell
      run: nix develop --command echo OK
