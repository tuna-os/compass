name: "Nix build"
# Linux first, and for now Linux only.
#
# ADR-0013 makes Linux-first a sequence rather than a scope limit: macOS and
# Windows get their own phases (9 and 10), and until then every non-Linux build
# on every pull request is work nobody reads. The Flatpak is what ships on
# Bluefin, so it is the one that stays.
#
# This is a trigger change, not a deletion. The jobs below are unchanged and
# still run from the Actions tab (`workflow_dispatch`); deleting the leading
# `# ` from the commented lines below restores them exactly, indentation
# included. Re-enable before Phase 9 starts, or earlier if a change here needs
# proving on a platform this no longer covers.
on:
#   push:
#     branches:
#       - main
#   pull_request:
#     branches:
#       - main

  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The default for every job in this file. Jobs that need more say so
# themselves, and a job-level block REPLACES this one rather than adding to it —
# so an elevated job must restate `contents: read` if it also checks out code.
#
# The point is what happens to the NEXT job somebody adds here: without this it
# inherits the repository default, which may be write-all. With it, a new job
# has to ask.
permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
    - name: Cache Nix Evaluation
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/nix
        key: nix-eval-${{ hashFiles('flake.lock') }}
    - uses: cachix/cachix-action@18cf96c7c98e048e10a83abd92116114cd8504be # v14
      with:
        name: vicinae
        authToken: ${{ github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
        pushFilter: "(swift-bin|swift-.*-RELEASE.*\\.tar\\.gz)"
    - name: Build Flake
      run: nix build -L
    - name: Run Test Shell
      run: nix develop --command echo OK
