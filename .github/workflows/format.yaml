name: Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Plain upstream Arch: the build deps are one pacman invocation, so a
    # prebuilt image is not worth a registry dependency. Installed below
    # from the same script the image Dockerfile uses.
    container: archlinux:latest

    steps:
      # actions/checkout silently falls back to a REST tarball with no .git when
      # git is missing, which breaks every later git step. The Depot image had
      # git baked in; plain archlinux:latest does not.
      - name: Bootstrap git
        run: pacman -Sy --needed --noconfirm git

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: ./scripts/runners/arch/install-deps.sh

      - name: Install pinned clang-format
        run: |
          url=$(curl -fsSL https://pypi.org/pypi/clang-format/23.1.0/json | jq -r '.urls[] | select(.filename | test("manylinux.*x86_64")) | .url')
          curl -fsSL "$url" | bsdtar -xOf - clang_format/data/bin/clang-format > /usr/local/bin/clang-format
          chmod +x /usr/local/bin/clang-format
          clang-format --version

      - name: Check C++ formatting
        run: make check-format

      - name: Check TypeScript formatting
        working-directory: src/typescript
        run: npx @biomejs/biome format
