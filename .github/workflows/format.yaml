name: Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}/build-env:arch-latest
      # ghcr packages are private until published publicly; GITHUB_TOKEN
      # can pull the ones this repository owns. Once the package is made
      # public these credentials and the packages:read scope can go.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pinned clang-format
        run: |
          url=$(curl -fsSL https://pypi.org/pypi/clang-format/23.1.0/json | jq -r '.urls[] | select(.filename | test("manylinux.*x86_64")) | .url')
          curl -fsSL "$url" | bsdtar -xOf - clang_format/data/bin/clang-format > /usr/local/bin/clang-format
          chmod +x /usr/local/bin/clang-format
          clang-format --version

      - name: Check C++ formatting
        run: make check-format

      - name: Check TypeScript formatting
        working-directory: src/typescript
        run: npx @biomejs/biome format
