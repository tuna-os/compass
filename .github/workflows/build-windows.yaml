name: Build (Windows)

# Linux first, and for now Linux only.
#
# ADR-0013 makes Linux-first a sequence rather than a scope limit: macOS and
# Windows get their own phases (9 and 10), and until then every non-Linux build
# on every pull request is work nobody reads. The Flatpak is what ships on
# Bluefin, so it is the one that stays.
#
# This is a trigger change, not a deletion. The jobs below are unchanged and
# still run from the Actions tab (`workflow_dispatch`); deleting the leading
# `# ` from the commented lines below restores them exactly, indentation
# included. Re-enable before Phase 9 starts, or earlier if a change here needs
# proving on a platform this no longer covers.
on:
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The default for every job in this file. Jobs that need more say so
# themselves, and a job-level block REPLACES this one rather than adding to it —
# so an elevated job must restate `contents: read` if it also checks out code.
#
# The point is what happens to the NEXT job somebody adds here: without this it
# inherits the repository default, which may be write-all. With it, a new job
# has to ask.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    name: Build (Windows / MSVC x64)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.1
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtshadertools qtimageformats
          cache: true

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: windows-ci

      - name: Configure
        run: >
          cmake --preset windows-ci
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build --preset windows-ci

      - name: Package (stage + installer)
        run: ./scripts/mkinstaller.ps1 -BuildDir build

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: vicinae-windows-x64-portable
          path: build/stage

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: vicinae-windows-x64-setup
          path: build/vicinae-*-setup.exe

      - name: sccache stats
        if: always()
        run: sccache --show-stats
