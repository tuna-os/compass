[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "GPL-3.0-only"
repository = "https://github.com/tuna-os/compass"

[workspace.dependencies]
compass-xdg = { path = "crates/compass-xdg" }
compass-search = { path = "crates/compass-search" }
compass-testkit = { path = "crates/compass-testkit" }

anyhow = "1"
nucleo-matcher = "0.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

# dev
insta = "1"
proptest = "1"
walkdir = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
