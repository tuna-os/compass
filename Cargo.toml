[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The minimum we support, not the version we develop on -- rust-toolchain.toml pins
# that, and the two are deliberately different. This one is set by what the Flatpak
# ships inside: org.freedesktop.Sdk.Extension.rust-stable//26.08 carries rustc 1.98,
# so anything higher here makes the Flatpak unbuildable. CI's `msrv` job builds the
# shipped binary on exactly this version, because an unenforced MSRV is a guess.
rust-version = "1.89"
license = "GPL-3.0-only"
repository = "https://github.com/tuna-os/compass"

[workspace.dependencies]
slug = "0.1.6"
percent-encoding = "2.3"
fend-core = "1.5.8"
compass-xdg = { path = "crates/compass-xdg" }
compass-search = { path = "crates/compass-search" }
compass-testkit = { path = "crates/compass-testkit" }
compass-core = { path = "crates/compass-core" }
compass-ipc = { path = "crates/compass-ipc" }
compass-shell = { path = "crates/compass-shell" }
compass-worker-host = { path = "crates/compass-worker-host" }
compass-extension-api = { path = "crates/compass-extension-api" }
compass-script = { path = "crates/compass-script" }
compass-portals = { path = "crates/compass-portals" }
compass-wayland = { path = "crates/compass-wayland" }
compass-wayland-protocols = { path = "crates/compass-wayland-protocols" }
compass-platform = { path = "crates/compass-platform" }
compass-platform-linux = { path = "crates/compass-platform-linux" }
compass-ui = { path = "crates/compass-ui" }
compass-crypto = { path = "crates/compass-crypto" }
compass-clipboard = { path = "crates/compass-clipboard" }
compass-sqlcipher-sys = { path = "crates/compass-sqlcipher-sys" }
compass-wayland-foreign = { path = "crates/compass-wayland-foreign" }

anyhow = "1"
nucleo-matcher = "0.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The JSON Schema published for `compass.json` is generated from the config
# types, not written by hand. See crates/compass-core/src/config.rs.
schemars = "1.2"
# The C++ engine's settings.json is JSONC (comments, trailing commas); the
# config migration reads it with dprint's parser. See config_migration.rs.
jsonc-parser = { version = "0.33", features = ["serde"] }
thiserror = "2"
# niri's own IPC types (Request, Reply, Window, Workspace); the Hyprland socket is
# hand-rolled. See CRATE-AUDIT "Compositor IPC".
niri-ipc = { version = "26.4", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "process"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }
oo7 = { version = "0.5", default-features = false, features = ["tokio", "native_crypto"] }
postcard = { version = "1", features = ["use-std"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
ashpd = { version = "0.13", default-features = false, features = ["tokio"] }
toml = "0.9"
# `slugify` normalises to NFD before stripping non-ASCII, so an accented
# letter keeps its base form. See crates/compass-core/src/slug.rs.
unicode-normalization = "0.1"
# File-indexer tree walking: parallel traversal with real gitignore semantics.
# See crates/compass-core/src/file_walk.rs for the launcher's policy layered on it.
ignore = "0.4"
# File-indexer MIME probing by extension, the way the C++ asks QMimeDatabase
# with MatchExtension. See crates/compass-db/src/sqlite_writer.rs.
mime_guess = "2"
# SQLite for every Compass database, built as SQLCipher 4 so the encrypted
# clipboard history and extension storage open. Default features are off: they
# add a wasm backend and nothing else we use. Only compass-sqlcipher-sys names
# this; callers use its re-export so the tokenizer registration cannot be
# skipped by opening a connection some other way.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled-sqlcipher", "cache"] }
libsqlite3-sys = { version = "0.38.2", default-features = false }

# Clipboard-at-rest crypto. See crates/compass-crypto/src/lib.rs for why these
# and not the `openssl` crate.
aes-gcm = "0.11"
hkdf = "0.13"
sha2 = "0.11"
getrandom = "0.3"
# Qt stores binary keyring entries base64-encoded; see crates/compass-crypto/src/keyring.rs.
base64 = "0.22"

# File-watcher backend: inotify on Linux, kqueue/FSEvents/ReFS equivalents
# elsewhere. See crates/compass-platform-linux/src/dir_watcher.rs.
notify = "8"

# Spike B (docs/rust-engine issue #3): the sandbox primitives Phase 4 plans to
# use. Both expose safe APIs, so `unsafe_code = "forbid"` still holds here.
landlock = "0.4"
seccompiler = "0.5"
libc = "0.2"
# Safe wrappers for the syscalls the sandbox tests have to call on purpose.
nix = { version = "0.29", features = ["ptrace", "socket", "resource", "signal"] }

# dev
insta = "1"
proptest = "1"
walkdir = "2"
tempfile = "3"     # also a runtime dep of the sandbox spike
parking_lot = "0.12"
criterion = { version = "0.5", features = ["async"] }
roxmltree = "0.20"
hex = "0.4"
# The HTTP client (remote images in extension views). Blocking, which is all
# an image fetch on a worker thread needs, and native-tls rather than rustls:
# the system OpenSSL is already linked for SQLCipher, so TLS adds no crypto
# stack, and it verifies against the system's roots, which is what a user
# behind a corporate CA has configured. See docs/rust-engine/CRATE-AUDIT.md.
# URL parsing: the OAuth redirect (`raycast://oauth?code=…&state=…`) and the
# authorize URL's `state`. Already in the tree through ureq and zbus.
url = "2.5"
#
# `native-tls`, not `native-tls-no-default`: ureq 3.4 decides whether its
# native-tls provider is compiled in with `cfg!(feature = "native-tls")`, so
# with only `-no-default` every https request panicked ("provider is NativeTls
# but feature is not enabled"). The difference is the bundled webpki roots,
# which are compiled in and never used: the agents ask for the platform's.
ureq = { version = "3.4", default-features = false, features = ["native-tls", "gzip"] }
# Extension store bundles (the Vicinae and Raycast stores serve zips). Only
# deflate, through the flate2/zlib-rs backend the tree already builds; the
# stores use nothing else, and an archive that does is refused.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# dev: the fake store the engine's end-to-end tests install from.
tiny_http = "0.12"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
