[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The minimum we support, not the version we develop on -- rust-toolchain.toml pins
# that, and the two are deliberately different. This one is set by what the Flatpak
# ships inside: org.freedesktop.Sdk.Extension.rust-stable//26.08 carries rustc 1.98,
# so anything higher here makes the Flatpak unbuildable. CI's `msrv` job builds the
# shipped binary on exactly this version, because an unenforced MSRV is a guess.
rust-version = "1.89"
license = "GPL-3.0-only"
repository = "https://github.com/tuna-os/compass"

[workspace.dependencies]
compass-xdg = { path = "crates/compass-xdg" }
compass-search = { path = "crates/compass-search" }
compass-testkit = { path = "crates/compass-testkit" }
compass-core = { path = "crates/compass-core" }
compass-ipc = { path = "crates/compass-ipc" }
compass-shell = { path = "crates/compass-shell" }
compass-worker-host = { path = "crates/compass-worker-host" }
compass-extension-api = { path = "crates/compass-extension-api" }
compass-portals = { path = "crates/compass-portals" }
compass-wayland = { path = "crates/compass-wayland" }
compass-platform = { path = "crates/compass-platform" }
compass-platform-linux = { path = "crates/compass-platform-linux" }
compass-ui = { path = "crates/compass-ui" }
compass-crypto = { path = "crates/compass-crypto" }

anyhow = "1"
nucleo-matcher = "0.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "process"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }
postcard = { version = "1", features = ["use-std"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
ashpd = { version = "0.13", default-features = false, features = ["tokio"] }
toml = "0.9"
# `slugify` normalises to NFD before stripping non-ASCII, so an accented
# letter keeps its base form. See crates/compass-core/src/slug.rs.
unicode-normalization = "0.1"
# File-indexer tree walking: parallel traversal with real gitignore semantics.
# See crates/compass-core/src/file_walk.rs for the vicinae policy layered on it.
ignore = "0.4"

# Clipboard-at-rest crypto. See crates/compass-crypto/src/lib.rs for why these
# and not the `openssl` crate.
aes-gcm = "0.11"
hkdf = "0.13"
sha2 = "0.11"
getrandom = "0.3"
# Qt stores binary keyring entries base64-encoded; see crates/compass-crypto/src/keyring.rs.
base64 = "0.22"

# File-watcher backend: inotify on Linux, kqueue/FSEvents/ReFS equivalents
# elsewhere. See crates/compass-platform-linux/src/dir_watcher.rs.
notify = "8"

# Spike B (docs/rust-engine issue #3): the sandbox primitives Phase 4 plans to
# use. Both expose safe APIs, so `unsafe_code = "forbid"` still holds here.
landlock = "0.4"
seccompiler = "0.5"
libc = "0.2"
# Safe wrappers for the syscalls the sandbox tests have to call on purpose.
nix = { version = "0.29", features = ["ptrace"] }

# dev
insta = "1"
proptest = "1"
walkdir = "2"
tempfile = "3"     # also a runtime dep of the sandbox spike
parking_lot = "0.12"
criterion = { version = "0.5", features = ["async"] }
roxmltree = "0.20"
hex = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
